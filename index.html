<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>因果湧現模擬器 v10.2｜Furniture Interaction</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/mobile.css">
  <link rel="stylesheet" href="styles/spatial.css">
  <link rel="stylesheet" href="styles/v101.css">
</head>
<body>
<div class="shell">
  <header class="appbar">
    <div>
      <div class="eyebrow">EMERGENT CAUSAL SIM</div>
      <h1>因果湧現模擬器 <span>v10.2・Furniture Interaction</span></h1>
    </div>
    <div class="clockbox"><b id="clock">第 1 天 12:00</b><small id="tickLabel">Tick 0</small></div>
  </header>

  <div class="toolbar">
    <button id="play">▶ 開始</button>
    <button id="step">單步</button>
    <button id="step10">10 步</button>
    <button id="reset" class="ghost">重置</button>
    <div class="toolbar-spacer"></div>
    <label class="seed-control">Seed <input id="seedInput" type="number" inputmode="numeric" value="20260911" title="重置時使用此隨機種子"></label>
    <label class="toggle"><input id="showThoughts" type="checkbox" checked> 決策原因</label>
  </div>

  <main class="workspace">
    <div class="maincol">
      <section class="panel view-panel mobile-active" data-view="map">
        <div class="panel-head">
          <div><b>空間圖</b><small>Zone 負責語意；Tile、家具與 interaction position 負責實際空間</small></div>
          <div id="worldBadges" class="world-badges"></div>
        </div>
        <div class="panel-body">
          <div id="map" class="map-grid"></div>
        </div>
      </section>

      <section class="panel view-panel" data-view="agents">
        <div class="panel-head"><div><b>目前行動</b><small>角色會沿格子逐步抵達互動位置，而不是只切換 Zone</small></div></div>
        <div class="panel-body"><div id="actions" class="action-board"></div></div>
      </section>

      <section class="panel view-panel" data-view="timeline">
        <div class="panel-head timeline-head">
          <div><b>時間線</b><small>預設隱藏純移動／規劃噪音</small></div>
          <div class="segmented"><button data-logmode="summary" class="active">摘要</button><button data-logmode="full">完整</button></div>
        </div>
        <div class="panel-body"><div id="timeline" class="timeline"></div></div>
      </section>
    </div>

    <aside class="panel inspector-panel view-panel" data-view="inspector">
      <div class="panel-head"><div><b>Inspector</b><small>可檢視角色、物件、家具、Zone、事件與單一 Tile</small></div></div>
      <div id="inspector" class="panel-body inspector"></div>
    </aside>
  </main>
</div>

<nav class="mobile-nav" aria-label="手機版分頁">
  <button data-tab="map" class="active"><span>🗺️</span>地圖</button>
  <button data-tab="agents"><span>👥</span>行動</button>
  <button data-tab="timeline"><span>📜</span>時間線</button>
  <button data-tab="inspector"><span>🔎</span>檢視</button>
</nav>

<script src="src/world.js" defer></script>
<script src="src/engine.js" defer></script>
<script src="src/recovery.js" defer></script>
<script src="src/supply.js" defer></script>
<script src="src/spatial.js" defer></script>
<script src="src/furniture.js" defer></script>
<script src="src/seating.js" defer></script>
<script src="src/ui.js" defer></script>
<script src="src/recovery-ui.js" defer></script>
<script src="src/supply-ui.js" defer></script>
<script src="src/spatial-ui.js" defer></script>
<script src="src/furniture-ui.js" defer></script>
</body>
</html>
