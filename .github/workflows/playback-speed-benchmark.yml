name: Playback Speed Benchmark (non-gating)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/playback-speed-benchmark.yml'
      - 'tests/browser-autoplay-speed-benchmark.mjs'
      - 'docs/playback-speed-benchmark.md'
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Complete ticks per measured case (100/720 are long non-gating runs)'
        type: choice
        required: true
        default: '10'
        options: ['10', '100', '720']
      intervals:
        description: 'Comma-separated nominal autoplay intervals in milliseconds'
        type: string
        required: true
        default: '700,350,175,87.5'
      selection:
        description: 'Agent Inspector selection'
        type: choice
        required: true
        default: 'both'
        options: [both, none, agent]

permissions:
  contents: read

concurrency:
  group: playback-speed-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Full-render autoplay measurement (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BENCHMARK_TICKS: ${{ github.event_name == 'workflow_dispatch' && inputs.ticks || '10' }}
      BENCHMARK_INTERVALS: ${{ github.event_name == 'workflow_dispatch' && inputs.intervals || '700,350,175,87.5' }}
      BENCHMARK_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate benchmark syntax
        run: node --check tests/browser-autoplay-speed-benchmark.mjs
      - name: Start simulator HTTP server
        run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          echo $! > /tmp/emergent-causal-sim-http.pid
          sleep 2
      - name: Measure complete tick and full render cadence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/browser-autoplay-speed-benchmark
          node tests/browser-autoplay-speed-benchmark.mjs \
            --ticks="$BENCHMARK_TICKS" \
            --intervals="$BENCHMARK_INTERVALS" \
            --selection="$BENCHMARK_SELECTION" 2>&1 \
            | tee artifacts/browser-autoplay-speed-benchmark/ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-speed-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-autoplay-speed-benchmark/
          if-no-files-found: warn
          retention-days: 14
