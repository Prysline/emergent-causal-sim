name: v11.12.4 browser QA

on:
  push:
    branches: [feature/v11.12.4-soft-reconsideration]
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install --save-dev @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p artifacts
          python3 -m http.server 4173 >/tmp/v1124-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v1124-http.log
          exit 1
      - run: npx playwright test tests/v1124-browser.spec.mjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1124-browser
          path: artifacts/
          if-no-files-found: ignore
