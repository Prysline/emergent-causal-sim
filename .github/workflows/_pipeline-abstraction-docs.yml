name: Branch pipeline abstraction docs cleanup

on:
  push:
    branches:
      - docs/pipeline-abstraction-level

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply abstraction cleanup
        run: |
          sed -i '/^## 2\. beforeTick$/i ### Diagram abstraction\n\nThe main Mermaid diagram uses lifecycle responsibility labels. Concrete implementation hook IDs stay in the registry tables below; action-specific names must not become architecture stage names.\n' docs/tick-pipeline.md
          sed -i 's/B100\[beforeTick 100\\nsocialOutcome\.capture-events\]/B100[beforeTick 100\\nRequester Outcome Capture]/' docs/tick-pipeline.md
          sed -i 's/B200\[200 memoryDeliberation\.capture-idle\]/B200[200 Memory-to-Deliberation Baseline Capture]/' docs/tick-pipeline.md
          sed -i 's/B300\[300 humanSocial\.prepare\]/B300[300 Human Social Prepare]/' docs/tick-pipeline.md
          sed -i 's/B400\[400 socialResponse\.capture-pet-offers\]/B400[400 Social Response Prepare]/' docs/tick-pipeline.md
          sed -i 's/B500\[500 affect\.decay\]/B500[500 Affect Decay]/' docs/tick-pipeline.md
          sed -i 's/B600\[600 memory\.capture-events\]/B600[600 Memory Observation Checkpoint]/' docs/tick-pipeline.md
          sed -i 's/B700\[700 intent\.soft-reconsideration\]/B700[700 Soft Reconsideration]/' docs/tick-pipeline.md
          sed -i 's/B800\[800 intent\.replan-preemption\]/B800[800 Replan - Preemption]/' docs/tick-pipeline.md
          sed -i 's/B900\[900 socialBid\.prepare\]/B900[900 Social Bid Prepare]/' docs/tick-pipeline.md
          sed -i 's/B1000\[1000 intent\.reconcile-before\]/B1000[1000 Intent Reconcile]/' docs/tick-pipeline.md
          sed -i 's/B1100\[1100 spatial\.capture\]/B1100[1100 Spatial Capture]/' docs/tick-pipeline.md
          sed -i 's/A100\[afterTick 100\\nspatial\.effects\]/A100[afterTick 100\\nSpatial Effects]/' docs/tick-pipeline.md
          sed -i 's/A200\[200 intent\.reconcile-after\]/A200[200 Intent Reconcile]/' docs/tick-pipeline.md
          sed -i 's/A300\[300 socialBid\.settle\]/A300[300 Social Bid Settle]/' docs/tick-pipeline.md
          sed -i 's/A400\[400 intent\.recover-aborts\]/A400[400 Abort Recovery]/' docs/tick-pipeline.md
          sed -i 's/A500\[500 memory\.process-events\]/A500[500 Memory Observation Process]/' docs/tick-pipeline.md
          sed -i 's/A600\[600 socialResponse\.resolve-pet-offers\]/A600[600 Social Response Resolve]/' docs/tick-pipeline.md
          sed -i 's/A700\[700 humanSocial\.resolve\]/A700[700 Human Social Resolve]/' docs/tick-pipeline.md
          sed -i 's/A800\[800 memoryDeliberation\.correct-initial\]/A800[800 Memory-to-Deliberation Correction]/' docs/tick-pipeline.md
          sed -i 's/A900\[900 socialOutcome\.process\]/A900[900 Private Social Outcome Process]/' docs/tick-pipeline.md
          sed -i 's/A1000\[1000 uiObservability\.render-mobile-summary\]/A1000[1000 Mobile Summary Render]/' docs/tick-pipeline.md
          sed -i 's/A1100\[1100 residentView\.schedule\]/A1100[1100 Resident View Schedule]/' docs/tick-pipeline.md
          sed -i 's/| Order | Hook ID | Owner |/| Order | Implementation Hook ID | Owner |/g' docs/tick-pipeline.md

          sed -i '/^### Current simulation ordering$/i **Pipeline abstraction rule:** Architecture diagrams and ordering summaries use lifecycle responsibility labels. Concrete implementation hook IDs stay in source, the exact registry tables in `docs/tick-pipeline.md`, and `tests/runtime-hook-pipeline.mjs`; action-specific names must not become architecture stage names.\n' docs/architecture.md
          sed -i 's/^100  socialOutcome\.capture-events$/100  Requester Outcome Capture/' docs/architecture.md
          sed -i 's/^200  memoryDeliberation\.capture-idle$/200  Memory-to-Deliberation Baseline Capture/' docs/architecture.md
          sed -i 's/^300  humanSocial\.prepare$/300  Human Social Prepare/' docs/architecture.md
          sed -i 's/^400  socialResponse\.capture-pet-offers$/400  Social Response Prepare/' docs/architecture.md
          sed -i 's/^500  affect\.decay$/500  Affect Decay/' docs/architecture.md
          sed -i 's/^600  memory\.capture-events$/600  Memory Observation Checkpoint/' docs/architecture.md
          sed -i 's/^700  intent\.soft-reconsideration$/700  Soft Reconsideration/' docs/architecture.md
          sed -i 's/^800  intent\.replan-preemption$/800  Replan - Preemption/' docs/architecture.md
          sed -i 's/^900  socialBid\.prepare$/900  Social Bid Prepare/' docs/architecture.md
          sed -i 's/^1000 intent\.reconcile-before$/1000 Intent Reconcile/' docs/architecture.md
          sed -i 's/^1100 spatial\.capture$/1100 Spatial Capture/' docs/architecture.md
          sed -i 's/^100 spatial\.effects$/100 Spatial Effects/' docs/architecture.md
          sed -i 's/^200 intent\.reconcile-after$/200 Intent Reconcile/' docs/architecture.md
          sed -i 's/^300 socialBid\.settle$/300 Social Bid Settle/' docs/architecture.md
          sed -i 's/^400 intent\.recover-aborts$/400 Abort Recovery/' docs/architecture.md
          sed -i 's/^500 memory\.process-events$/500 Memory Observation Process/' docs/architecture.md
          sed -i 's/^600 socialResponse\.resolve-pet-offers$/600 Social Response Resolve/' docs/architecture.md
          sed -i 's/^700 humanSocial\.resolve$/700 Human Social Resolve/' docs/architecture.md
          sed -i 's/^800 memoryDeliberation\.correct-initial$/800 Memory-to-Deliberation Correction/' docs/architecture.md
          sed -i 's/^900 socialOutcome\.process$/900 Private Social Outcome Process/' docs/architecture.md
      - name: Verify abstraction boundary
        run: |
          grep -q 'Social Response Prepare' docs/tick-pipeline.md
          grep -q 'Implementation Hook ID' docs/tick-pipeline.md
          grep -q 'Pipeline abstraction rule' docs/architecture.md
          if grep -A45 '^## 1\. ' docs/tick-pipeline.md | grep -q 'capture-pet-offers'; then
            echo 'main pipeline graph still exposes action-specific hook ID'
            exit 1
          fi
      - name: Commit docs and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_pipeline-abstraction-docs.yml
          git add docs/architecture.md docs/tick-pipeline.md
          git commit -m 'Clarify pipeline abstraction level'
          git push origin HEAD:docs/pipeline-abstraction-level
