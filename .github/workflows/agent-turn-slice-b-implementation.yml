name: Agent turn Slice B implementation

on:
  push:
    branches: [feat/agent-turn-execution]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: agent-turn-slice-b-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref_name == 'feat/agent-turn-execution') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/agent-turn-execution'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-turn-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic Slice B migration
        run: python scripts/agent-turn-slice-b-migrate.py
      - name: Static syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Focused turn regressions
        run: |
          node tests/agent-turn-execution.mjs
          node tests/agent-facing-foundation.mjs
          node tests/locomotion-execution-posture.mjs
          node tests/locomotion-traversal-cost.mjs
          node tests/initial-state-pipeline.mjs
      - name: Full Node regression profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shlex
          for line in Path('.github/workflows/node-regression.yml').read_text().splitlines():
              line=line.strip()
              if line.startswith('- run: node tests/'):
                  cmd=line[len('- run: '):]
                  print('+',cmd,flush=True)
                  subprocess.run(shlex.split(cmd),check=True)
          PY
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout HEAD -- .github/workflows/node-regression.yml .github/workflows/agent-turn-slice-b-implementation.yml
          git add -A
          git status --short
          git commit -m "Implement Agent turn execution foundation"
          git push origin HEAD:feat/agent-turn-execution
