name: Agent turn Slice B implementation

on:
  push:
    branches: [feat/agent-turn-execution]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: agent-turn-slice-b-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref_name == 'feat/agent-turn-execution') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/agent-turn-execution'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-turn-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic Slice B migration
        run: python scripts/agent-turn-slice-b-migrate.py
      - name: Preserve unchanged subsystem marker expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          new='11.50.0-agent-turn-execution'
          old='11.38.0-carried-handling-risk'
          for path in Path('tests').rglob('*.mjs'):
              text=path.read_text()
              fixed=text.replace(f"const ROUTE_VERSION='{new}';",f"const ROUTE_VERSION='{old}';")
              fixed=fixed.replace(f"const TRAVERSAL_VERSION='{new}';",f"const TRAVERSAL_VERSION='{old}';")
              if fixed != text:
                  path.write_text(fixed)
          PY
      - name: Static syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Focused turn regressions
        shell: bash
        run: |
          set +e
          : > slice-b-verifier.log
          status=0
          for test in \
            tests/agent-turn-execution.mjs \
            tests/agent-facing-foundation.mjs \
            tests/locomotion-execution-posture.mjs \
            tests/locomotion-traversal-cost.mjs \
            tests/initial-state-pipeline.mjs
          do
            echo "+ node $test" | tee -a slice-b-verifier.log
            node "$test" 2>&1 | tee -a slice-b-verifier.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; break; fi
          done
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add slice-b-verifier.log
            git commit -m "Capture Agent turn verifier failure"
            git push origin HEAD:feat/agent-turn-execution
            exit "$status"
          fi
      - name: Full semantic Node profile before verifier cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shlex
          deferred='node tests/workflow-architecture.mjs'
          for line in Path('.github/workflows/node-regression.yml').read_text().splitlines():
              line=line.strip()
              if line.startswith('- run: node tests/'):
                  cmd=line[len('- run: '):]
                  if cmd == deferred:
                      print('+ deferred until temporary verifier cleanup:',cmd,flush=True)
                      continue
                  print('+',cmd,flush=True)
                  subprocess.run(shlex.split(cmd),check=True)
          PY
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f slice-b-verifier.log
          git checkout HEAD -- .github/workflows/node-regression.yml .github/workflows/agent-turn-slice-b-implementation.yml
          git add -A
          git status --short
          git commit -m "Implement Agent turn execution foundation"
          git push origin HEAD:feat/agent-turn-execution
