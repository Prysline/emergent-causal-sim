name: Source snapshot temp

on:
  push:
    branches:
      - feat/v11.11.3-node-aware-floor-effects

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload working source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-temp
          path: |
            index.html
            src
            styles
            tests
            .github/workflows/state-regression.yml
          if-no-files-found: error
