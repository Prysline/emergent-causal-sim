name: Apply v11.10 interaction patch

on:
  push:
    branches: [v11-10-interaction-stimulus]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-10-interaction-stimulus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply engine update
        run: node tools/apply-v11-10-engine.mjs
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Emit patched engine blob
        run: |
          echo 'ENGINE_B64_BEGIN'
          base64 -w0 src/engine.js
          echo
          echo 'ENGINE_B64_END'
