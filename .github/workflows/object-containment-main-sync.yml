name: Object containment main sync

on:
  push:
    branches: [feature/object-containment-v1]

permissions:
  contents: write

concurrency:
  group: object-containment-main-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge current main without rewriting feature history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X ours
      - name: Preserve Slot arrival release history in containment versioning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/versioning.md')
          s=p.read_text()
          marker='`11.57.1-slot-approach-arrival`'
          if marker not in s:
              anchor='前一個 `11.57.0-sleep-animal-conflict`'
              note='前一個 `11.57.1-slot-approach-arrival` 修正 Furniture Slot-use arrival correctness：chooser-time approach winner 只作 ephemeral navigation witness；`sleep`、`rest` 與 Human `meal` execution 以 current `slotApproachNodes()` 判斷是否已抵達任一合法 approach，並在下一個 core tick 重驗 settle / sit legality。Furniture / Spatial / Route schema 與 Sleep conflict policy 未因此改變。\n\n'
              if anchor not in s: raise SystemExit('versioning insertion anchor missing')
              s=s.replace(anchor,note+anchor,1)
              p.write_text(s)
          p=Path('README.md')
          s=p.read_text()
          if marker not in s:
              anchor='## Current authority navigation'
              note='前一個 `11.57.1-slot-approach-arrival` 已修正 Furniture Slot-use arrival：chooser-time approach winner 只作 ephemeral navigation witness；`sleep`、`rest` 與 Human `meal` execution 以 current `slotApproachNodes()` 判斷是否已抵達任一合法 approach。\n\n'
              if anchor not in s: raise SystemExit('README insertion anchor missing')
              s=s.replace(anchor,note+anchor,1)
              p.write_text(s)
          PY
      - name: Verify both workstreams survived the merge
        run: |
          grep -q '11.58.0-object-containment' src/release.js
          grep -q 'Slot-use arrival contract' docs/architecture.md
          grep -q 'current legal Slot approach' docs/interaction-geometry.md
          grep -q '11.57.1-slot-approach-arrival' docs/versioning.md
          grep -q '11.57.1-slot-approach-arrival' README.md
          node tests/check-source-syntax.mjs
          node tests/object-containment.mjs
          node tests/action-spatial-target-consumers.mjs
          node tests/current-version-ownership.mjs
          node tests/production-source-load-architecture.mjs
      - name: Push verified merge commit without temporary workflow
        run: |
          git rm .github/workflows/object-containment-main-sync.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:${GITHUB_REF_NAME}
