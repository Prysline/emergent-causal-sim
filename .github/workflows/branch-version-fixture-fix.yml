name: Branch version fixture correction

on:
  push:
    branches: [feature/carrying-state-replanning]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carrying-state-replanning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore unchanged subsystem generation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='11.47.0-social-bid-carry-cooperation'
          p=Path('tests/production-source-load-architecture.mjs')
          s=p.read_text()
          s=s.replace("assert.equal(E.SLEEP_SLOT_CONFLICT_VERSION,CURRENT_VERSION);", f"assert.equal(E.SLEEP_SLOT_CONFLICT_VERSION,'{old}','Sleep Slot Conflict own generation must not fake-bump for generic carrying replanning');")
          p.write_text(s)
          p=Path('tests/sleep-preferred-slot-conflict.mjs')
          s=p.read_text()
          s=s.replace("assert.equal(E.SLEEP_SLOT_CONFLICT_VERSION,APP_VERSION);", f"assert.equal(E.SLEEP_SLOT_CONFLICT_VERSION,'{old}','Sleep Slot Conflict own generation must not fake-bump for generic carrying replanning');")
          p.write_text(s)
          PY
          node tests/production-source-load-architecture.mjs
          node tests/sleep-preferred-slot-conflict.mjs
      - name: Commit fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/production-source-load-architecture.mjs tests/sleep-preferred-slot-conflict.mjs
          git commit -m 'Preserve Sleep conflict own generation assertions'
          git push origin HEAD:feature/carrying-state-replanning