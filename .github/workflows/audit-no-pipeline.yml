name: Audit legacy no-pipeline runtime

on:
  push:
    branches: [refactor/remove-no-pipeline-fallbacks]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-no-pipeline-fallbacks
      - run: python3 .github/scripts/audit-no-pipeline.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add no-pipeline-audit.md
          git commit -m 'Generate no-pipeline runtime audit'
          git push origin HEAD:refactor/remove-no-pipeline-fallbacks
