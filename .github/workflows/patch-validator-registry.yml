name: Patch validator rule registry

on:
  push:
    branches: [refactor/validator-rule-registry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/validator-rule-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validator registry migration
        run: python .github/scripts/patch-validator-registry.py
      - name: Syntax and focused ownership regression
        run: |
          for f in src/*.js; do node --check "$f"; done
          node tests/validator-rule-registry.mjs
      - name: Prepare migration commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/scripts/patch-validator-registry.py .github/workflows/patch-validator-registry.yml .github/workflows/state-regression.yml
          git add -A
          git status --short
          git commit -m "Refactor validator ownership into named registry"
      - name: Push migration commit
        run: git push origin HEAD:refactor/validator-rule-registry
