name: Patch validator rule registry

on:
  push:
    branches: [refactor/validator-rule-registry]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/validator-rule-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validator registry migration
        run: python .github/scripts/patch-validator-registry.py
      - name: Syntax and focused ownership regression
        run: |
          for f in src/*.js; do node --check "$f"; done
          node tests/validator-rule-registry.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor validator ownership into named registry"
          git push
