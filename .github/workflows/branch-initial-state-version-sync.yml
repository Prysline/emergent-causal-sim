name: Branch initial state version sync
on:
  push:
    branches: [feature/social-bid-carry-cooperation]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-bid-carry-cooperation
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/initial-state-pipeline.mjs')
          s=p.read_text().replace("assert.equal(customState.version,'11.46.0-sleep-carry-integration');", "assert.equal(customState.version,'11.47.0-social-bid-carry-cooperation');")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/initial-state-pipeline.mjs
          git commit -m "Sync initial-state runtime assertion"
          git push origin HEAD:feature/social-bid-carry-cooperation
