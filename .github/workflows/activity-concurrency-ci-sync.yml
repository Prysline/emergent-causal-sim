name: Activity concurrency CI sync

on:
  push:
    branches:
      - activity-concurrency-eating-social

permissions:
  contents: write

jobs:
  sync-stale-regressions:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activity-concurrency-eating-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact regression marker updates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $replacements = @(
            @('tests/dining-table-prone-shortcut.mjs', "const VERSION='11.51.0-activity-concurrency';", "const CURRENT_VERSION='11.51.0-activity-concurrency';`nconst LOCOMOTION_VERSION='11.50.1-prone-transition-burden';"),
            @('tests/dining-table-prone-shortcut.mjs', 'assert.equal(st.version,VERSION);', 'assert.equal(st.version,CURRENT_VERSION);'),
            @('tests/dining-table-prone-shortcut.mjs', 'assert.equal(L.VERSION,VERSION);', 'assert.equal(L.VERSION,LOCOMOTION_VERSION);'),
            @('tests/browser-resident-view-qa.mjs', "const CURRENT_VERSION='11.50.1-prone-transition-burden';", "const CURRENT_VERSION='11.51.0-activity-concurrency';"),
            @('tests/browser-resident-view-qa.mjs', "assert.equal(desktop.releaseLabel,'v11.50.1','app header must project the short release label from canonical SimRelease.VERSION');", "assert.equal(desktop.releaseLabel,'v11.51.0','app header must project the short release label from canonical SimRelease.VERSION');"),
            @('tests/browser-debug-inspector-contextual-diagnostics-qa.mjs', "const CURRENT_VERSION='11.50.1-prone-transition-burden';", "const CURRENT_VERSION='11.51.0-activity-concurrency';"),
            @('tests/browser-presentation-event-truth-qa.mjs', "window.SimRelease?.VERSION==='11.50.1-prone-transition-burden'", "window.SimRelease?.VERSION==='11.51.0-activity-concurrency'"),
            @('tests/browser-presentation-event-truth-qa.mjs', "assert.equal(snap.release,'11.50.1-prone-transition-burden');", "assert.equal(snap.release,'11.51.0-activity-concurrency');"),
            @('tests/browser-presentation-event-truth-qa.mjs', "assert.equal(snap.label,'v11.50.1');", "assert.equal(snap.label,'v11.51.0');"),
            @('tests/browser-human-social-response-qa.mjs', '11.13.3a-human-social-response', '11.51.0-activity-concurrency')
          )
          $cache = @{}
          foreach ($replacement in $replacements) {
            $path = $replacement[0]; $old = $replacement[1]; $new = $replacement[2]
            if (-not $cache.ContainsKey($path)) { $cache[$path] = [IO.File]::ReadAllText($path) }
            if (-not $cache[$path].Contains($old)) { throw "Missing expected text in ${path}: ${old}" }
            $cache[$path] = $cache[$path].Replace($old, $new)
          }
          foreach ($path in $cache.Keys) {
            [IO.File]::WriteAllText($path, $cache[$path], (New-Object Text.UTF8Encoding($false)))
          }
      - name: Verify focused regressions and preflight
        shell: pwsh
        run: |
          node tests/check-source-syntax.mjs
          node tests/activity-concurrency-eating-social.mjs
          node tests/dining-table-prone-shortcut.mjs
          node tests/test-profile-composition.mjs
          node tests/pr-preflight.mjs
          git diff --check
      - name: Commit sync and remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/activity-concurrency-ci-sync.yml
          git add tests/dining-table-prone-shortcut.mjs tests/browser-resident-view-qa.mjs tests/browser-debug-inspector-contextual-diagnostics-qa.mjs tests/browser-presentation-event-truth-qa.mjs tests/browser-human-social-response-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix stale release markers in Node and browser regressions'
          git push origin HEAD:activity-concurrency-eating-social
