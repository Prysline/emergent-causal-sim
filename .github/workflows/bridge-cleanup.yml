name: Bridge cleanup
on:
  push:
    branches: [refactor/remove-pending-interaction-bridge]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-pending-interaction-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical Social Bid responder option path
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement in {path}: {old[:120]!r}')
              s2=s.replace(old,new,1)
              p.write_text(s2)

          engine='src/engine.js'
          replace_once(engine,
            "  let state=null,eventSeq=0;\n",
            "  let state=null,eventSeq=0;\n  const decisionOptionProviders=[];\n  function registerDecisionOptionProvider(id,provider,order=0){if(!id||typeof provider!=='function')throw new Error('decision option provider requires id + function');if(decisionOptionProviders.some(x=>x.id===id))throw new Error(`duplicate decision option provider: ${id}`);const entry={id,provider,order:Number(order)||0};decisionOptionProviders.push(entry);decisionOptionProviders.sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id));return entry;}\n  function listDecisionOptionProviders(){return decisionOptionProviders.map(({id,order})=>({id,order}));}\n  function providerDecisionOptions(a){const out=[];for(const entry of decisionOptionProviders){const value=entry.provider(state,a);if(value==null)continue;for(const option of Array.isArray(value)?value:[value])if(option?.id&&Number.isFinite(option.score))out.push({...option});}return out;}\n")
          replace_once(engine,
            "const cat=a.pendingInteraction?.type==='cat_request'?state.agents[a.pendingInteraction.from]:nearestAgent(a,'cat');if(cat)o.push({id:'petCat',targetAgent:cat.id,score:a.pendingInteraction?.type==='cat_request'?72+a.traits.animalAffinity*20:8+a.traits.animalAffinity*18+a.needs.social*.18,why:a.pendingInteraction?.type==='cat_request'?['貓剛剛主動討摸','回應已形成短期社交動機']:['對貓的親和度','睡著的貓仍可被輕摸，但不保證醒來或回應']});",
            "const cat=nearestAgent(a,'cat');if(cat)o.push({id:'petCat',targetAgent:cat.id,score:8+a.traits.animalAffinity*18+a.needs.social*.18,why:['對貓的親和度','睡著的貓仍可被輕摸，但不保證醒來或回應']});")
          replace_once(engine,
            "if(directDrinkContainers('water',a))o.push({id:'drinkWater',score:a.needs.thirst*1.05+8,why:['口渴']});}return o.map(x=>({...x,score:Math.max(0,x.score+rand(-5,5))})).sort((a,b)=>b.score-a.score);}",
            "if(directDrinkContainers('water',a))o.push({id:'drinkWater',score:a.needs.thirst*1.05+8,why:['口渴']});}o.push(...providerDecisionOptions(a));return o.map(x=>({...x,score:Math.max(0,x.score+rand(-5,5))})).sort((a,b)=>b.score-a.score);}")
          replace_once(engine,
            "  function startAction(a,choice){a.action=buildAction(a,choice);if(choice.id==='petCat'&&a.action&&a.pendingInteraction?.type==='cat_request'&&a.action.targetAgent===a.pendingInteraction.from)a.pendingInteraction.accepted=true;if(a.action)addEvent(`${a.name}決定${ZH[choice.id]||choice.id}。`,'system',[],{actor:a.id,action:choice.id,phase:'plan',position:positionRef(a.position)});}\n",
            "  function startAction(a,choice){a.action=buildAction(a,choice);if(a.action)addEvent(`${a.name}決定${ZH[choice.id]||choice.id}。`,'system',[],{actor:a.id,action:choice.id,phase:'plan',position:positionRef(a.position)});}\n")
          replace_once(engine,
            "if(wasSleeping){const wake=tryWakeFromInteraction(target,{...SOCIAL_STIMULUS.seekHuman,reason:`${a.name}的喵叫與碰觸`,causeIds:[contact]});if(wake.woke)target.pendingInteraction={type:'cat_request',from:a.id,createdTick:state.tick,expiresTick:state.tick+3,accepted:false};else addEvent(`${target.name}沒有醒來，${a.name}沒有得到立即回應。`,'normal',[contact],{actor:a.id,target:target.id,action:'sleepDisturbance',stimulusIntensity:wake.intensity,stimulusKind:wake.kind,wakeChance:wake.chance,wakeRoll:wake.roll,position:positionRef(target.position)});}else target.pendingInteraction={type:'cat_request',from:a.id,createdTick:state.tick,expiresTick:state.tick+3,accepted:false};",
            "let perceivedByTarget=!wasSleeping;if(wasSleeping){const wake=tryWakeFromInteraction(target,{...SOCIAL_STIMULUS.seekHuman,reason:`${a.name}的喵叫與碰觸`,causeIds:[contact]});perceivedByTarget=wake.woke;if(!wake.woke)addEvent(`${target.name}沒有醒來，${a.name}沒有得到立即回應。`,'normal',[contact],{actor:a.id,target:target.id,action:'sleepDisturbance',stimulusIntensity:wake.intensity,stimulusKind:wake.kind,wakeChance:wake.chance,wakeRoll:wake.roll,position:positionRef(target.position)});}const contactEvent=state.causes[contact];if(contactEvent?.data)contactEvent.data.perceivedByTarget=perceivedByTarget;")
          replace_once(engine,
            "  function expirePendingInteractions(){for(const a of Object.values(state.agents)){const p=a.pendingInteraction;if(!p||state.tick<p.expiresTick)continue;const from=state.agents[p.from];if(p.type==='cat_request')addEvent(`${a.name}沒有立刻回應${from?.name||'對方'}的撒嬌，${from?.name||'對方'}便自己走開了。`,'normal',[],{actor:a.id,target:p.from,action:'catRequestExpired',accepted:!!p.accepted});a.pendingInteraction=null;}}\n",
            "")
          replace_once(engine,
            "function tick(){state.tick++;state.minute+=2;dayRollover();decayNoise();needDrift();expirePendingInteractions();for(const a of shuffle(Object.values(state.agents))){",
            "function tick(){state.tick++;state.minute+=2;dayRollover();decayNoise();needDrift();for(const a of shuffle(Object.values(state.agents))){")
          replace_once(engine,
            "holderOf,buildAction};\n",
            "holderOf,buildAction,registerDecisionOptionProvider,listDecisionOptionProviders};\n")

          bid='src/social-bid-runtime-v1122.js'
          replace_once(bid,
            "      if(!Array.isArray(a.observedSocialBids))a.observedSocialBids=[];\n      delete a.pendingInteraction;\n",
            "      if(!Array.isArray(a.observedSocialBids))a.observedSocialBids=[];\n")
          replace_once(bid,
            "  function newestObservedCatBid(st,a){return observedBidRefs(st,a).map(ref=>({ref,bid:bidEvent(st,ref.bidId)})).filter(x=>x.bid?.data?.bidKind==='catAffection'&&x.bid.data.bidTo===a.id).sort((x,y)=>y.ref.observedTick-x.ref.observedTick)[0]||null;}\n",
            "  function newestObservedCatBid(st,a){return observedBidRefs(st,a).map(ref=>({ref,bid:bidEvent(st,ref.bidId)})).filter(x=>x.bid?.data?.bidKind==='catAffection'&&x.bid.data.bidTo===a.id).sort((x,y)=>y.ref.observedTick-x.ref.observedTick)[0]||null;}\n  function socialBidDecisionOptions(st,a){if(a?.kind!=='human'||a.action)return[];const pick=newestObservedCatBid(st,a);if(!pick)return[];const target=st.agents?.[pick.bid?.data?.bidFrom];if(!target||target.offMap)return[];return[{id:'petCat',targetAgent:target.id,score:72+(a.traits?.animalAffinity||0)*20,why:['貓剛剛主動討摸','回應已形成短期社交動機'],socialBidId:pick.bid.id,socialBidObservedTick:pick.ref.observedTick}];}\n")
          start="  function injectResponderCompatibility(st,injected){\n"
          end="  function annotateNewBids(st,newEvents){\n"
          s=Path(bid).read_text(); i=s.find(start); j=s.find(end)
          if i<0 or j<0 or j<=i: raise SystemExit('injectResponderCompatibility block not found')
          Path(bid).write_text(s[:i]+s[j:])
          replace_once(bid,
            "      const requester=st.agents[e.data.actor],target=st.agents[e.data.target],compat=target?.pendingInteraction;\n      const perceived=!!(target&&compat?.type==='cat_request'&&compat.from===requester?.id);e.data.perceivedByTarget=perceived;\n      if(requester&&!requester.action)requester.activeIntent=awaitIntent(st,requester,e);\n      if(!perceived)continue;\n      const ref=addObservedBid(st,target,e,st.tick);if(target.action?.kind==='petCat'&&compat?.accepted)promoteResponseIntent(st,target,e,ref.observedTick);\n",
            "      const requester=st.agents[e.data.actor],target=st.agents[e.data.target];\n      const perceived=e.data?.perceivedByTarget===true;e.data.perceivedByTarget=perceived;\n      if(requester&&!requester.action)requester.activeIntent=awaitIntent(st,requester,e);\n      if(!perceived)continue;\n      addObservedBid(st,target,e,st.tick);\n")
          start="  function promoteInjectedResponses(st,injected){\n"
          end="  function annotateResponses(st,newEvents,responseBefore){\n"
          s=Path(bid).read_text(); i=s.find(start); j=s.find(end)
          if i<0 or j<0 or j<=i: raise SystemExit('promoteInjectedResponses block not found')
          insertion="  function promoteChosenResponses(st){for(const a of Object.values(st.agents||{})){const pick=st.thoughts?.[a.id]?.pick,bidId=pick?.socialBidId;if(!bidId||a.action?.kind!=='petCat'||a.action.started!==st.tick)continue;const bid=bidEvent(st,bidId);if(!bid||bid.data?.bidTo!==a.id||a.action.targetAgent!==bid.data?.bidFrom)continue;promoteResponseIntent(st,a,bid,pick.socialBidObservedTick??st.tick);}}\n"
          Path(bid).write_text(s[:i]+insertion+s[j:])
          replace_once(bid,
            "  function removeCompatibilityState(st){for(const a of Object.values(st.agents||{}))delete a.pendingInteraction;}\n  function prepareTick(st){\n    const snap={marker:st.events?.[0]?.id||null,injected:new Map(),responseBefore:new Map()};\n    for(const a of Object.values(st.agents||{}))if(a.activeIntent?.kind==='respondSocialBid'&&a.activeIntent.source?.bidId)snap.responseBefore.set(a.id,a.activeIntent.source.bidId);\n    removeCompatibilityState(st);injectWaitingActions(st);injectResponderCompatibility(st,snap.injected);return snap;\n  }\n  function settleTick(after,snap){\n    if(!snap)return;const newEvents=newEventsSince(after,snap.marker);annotateNewBids(after,newEvents);promoteInjectedResponses(after,snap.injected);annotateResponses(after,newEvents,snap.responseBefore);removeCompatibilityState(after);pruneObservedRefs(after);expirePrivateWaiting(after);E.reconcileIntents?.(after);\n  }\n",
            "  function prepareTick(st){\n    const snap={marker:st.events?.[0]?.id||null,responseBefore:new Map()};\n    for(const a of Object.values(st.agents||{}))if(a.activeIntent?.kind==='respondSocialBid'&&a.activeIntent.source?.bidId)snap.responseBefore.set(a.id,a.activeIntent.source.bidId);\n    injectWaitingActions(st);return snap;\n  }\n  function settleTick(after,snap){\n    if(!snap)return;const newEvents=newEventsSince(after,snap.marker);annotateNewBids(after,newEvents);promoteChosenResponses(after);annotateResponses(after,newEvents,snap.responseBefore);pruneObservedRefs(after);expirePrivateWaiting(after);E.reconcileIntents?.(after);\n  }\n")
          replace_once(bid,
            "  if(E.registerRuntimeHook){\n",
            "  E.registerDecisionOptionProvider?.('socialBid.respond-cat-affection',socialBidDecisionOptions,100);\n\n  if(E.registerRuntimeHook){\n")
          replace_once(bid,
            "newestObservedCatBid,addObservedBid,canObserveSocialResponderContext:canObserveResponderContext});\n",
            "newestObservedCatBid,socialBidDecisionOptions,addObservedBid,canObserveSocialResponderContext:canObserveResponderContext});\n")

          validator='src/state-validator-v1122.js'
          replace_once(validator,
            "if(own(a,'pendingInteraction'))add('legacy_pending_interaction_persistent',`${a.name} 仍保存 legacy pendingInteraction；v11.12.2 只允許 runtime transient compatibility。`,{agentId:a.id});",
            "if(own(a,'pendingInteraction'))add('legacy_pending_interaction_persistent',`${a.name} 仍保存已移除的 legacy pendingInteraction；Social Bid responder 必須直接由 observedSocialBids / decision option contract 形成。`,{agentId:a.id});")

          test='tests/social-bid-lifecycle.mjs'
          replace_once(test,
            "assert.equal(E.SOCIAL_BID_SCHEMA_VERSION,'11.12.2-social-bid-lifecycle');\n",
            "assert.equal(E.SOCIAL_BID_SCHEMA_VERSION,'11.12.2-social-bid-lifecycle');\nassert.ok(E.listDecisionOptionProviders().some(x=>x.id==='socialBid.respond-cat-affection'),'Social Bid responder option provider must be registered');\n")
          replace_once(test,
            "// responder observation is a local reference, while legacy pendingInteraction is removed again after the tick.\n",
            "// responder observation is a local reference; no pendingInteraction compatibility state is created.\n")
          replace_once(test,
            "human.action=null;human.activeIntent=null;human.position={x:10,y:6};\nconst requesterPos={...cat.position};\nE.tick();\n",
            "human.action=null;human.activeIntent=null;human.position={x:10,y:6};\nconst requesterPos={...cat.position};\nconst responseChoices=E.socialBidDecisionOptions(st,human);\nassert.equal(responseChoices.length,1,'observed cat Bid should produce one responder candidate');\nassert.equal(responseChoices[0].id,'petCat');\nassert.equal(responseChoices[0].targetAgent,'orange');\nassert.equal(responseChoices[0].socialBidId,bid.id);\nE.tick();\n")
          replace_once(test,
            "assert.equal(human.action?.targetAgent,'orange');\nassert.equal(cat.activeIntent?.kind,'awaitResponse');\n",
            "assert.equal(human.action?.targetAgent,'orange');\nassert.equal(st.thoughts?.zhou?.pick?.socialBidId,bid.id,'core chooser should preserve Social Bid provenance on the chosen candidate');\nassert.equal(Object.prototype.hasOwnProperty.call(human,'pendingInteraction'),false);\nassert.equal(cat.activeIntent?.kind,'awaitResponse');\n")
          marker="// Long-run integration keeps active Social Bid state bounded and never restores shared pending request truth.\n"
          competition="// Responder option remains a normal candidate: urgent core needs may still win instead of forcing a response.\nE.reset(31415);\nst=E.getState();\nconst competingHuman=st.agents.zhou,competingCat=st.agents.orange;\ncompetingHuman.position={x:4,y:6};competingCat.position={x:4,y:6};\nconst competingBidId=E.addEvent('橘子發出一次測試用社交邀請。','good',[],{actor:'orange',target:'zhou',action:'seekHuman',socialBid:true,bidKind:'catAffection',interactionKind:'socialAffection',expectsResponse:true,bidFrom:'orange',bidTo:'zhou',perceivedByTarget:true});\nst.causes[competingBidId].data.bidId=competingBidId;\ncompetingHuman.observedSocialBids=[{bidId:competingBidId,observedTick:st.tick,expiresTick:st.tick+6}];\ncompetingHuman.action=null;competingHuman.activeIntent=null;competingHuman.needs.hunger=0;competingHuman.needs.thirst=100;competingHuman.needs.fatigue=0;competingHuman.needs.sleepNeed=0;competingHuman.needs.social=0;\nE.tick();\nst=E.getState();\nassert.equal(st.agents.zhou.action?.kind,'drinkWater','urgent thirst should be able to beat the Social Bid response candidate');\nassert.notEqual(st.agents.zhou.activeIntent?.kind,'respondSocialBid','Social Bid provider must not force responder policy');\nassert.ok(st.agents.zhou.observedSocialBids.some(x=>x.bidId===competingBidId),'unselected observed Bid should remain available within its bounded lifetime');\nnoIssues('responder candidate competes with urgent core need');\n\n"
          replace_once(test,marker,competition+marker)

          for path in ['src/engine.js','src/social-bid-runtime-v1122.js']:
              if 'pendingInteraction' in Path(path).read_text():
                  raise SystemExit(f'legacy pendingInteraction still present in normal runtime: {path}')
      - name: Focused regressions
        run: |
          for f in src/*.js; do node --check "$f"; done
          node tests/social-bid-lifecycle.mjs
          node tests/intent-replan-preemption.mjs
          node tests/soft-reconsideration-hysteresis.mjs
          node tests/runtime-hook-pipeline.mjs
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.js src/social-bid-runtime-v1122.js src/state-validator-v1122.js tests/social-bid-lifecycle.mjs
          git commit -m "refactor: remove pending interaction Social Bid bridge [bridge-cleanup]"
          git push origin HEAD:refactor/remove-pending-interaction-bridge
