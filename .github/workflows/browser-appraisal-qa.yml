name: Browser appraisal QA

on:
  push:
    branches: [feature/v11.13.1-event-appraisal]
  workflow_dispatch:

concurrency:
  group: browser-appraisal-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          echo $! > /tmp/emergent-causal-sim-http.pid
          sleep 2
      - run: node tests/browser-appraisal-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-appraisal-qa
          path: artifacts/browser-appraisal-qa
          if-no-files-found: ignore
