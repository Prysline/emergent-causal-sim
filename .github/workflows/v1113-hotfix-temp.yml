name: v11.11.3 hotfix temp

on:
  push:
    branches:
      - feat/v11.11.3-node-aware-floor-effects

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy fallback without recursion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/engine.js')
          s=p.read_text()
          old="return SP.nodeSame(state,here,target);}return atSpatialPosition(a,p);}"
          new="return SP.nodeSame(state,here,target);}return SP.same(a.position,p);}"
          if s.count(old)!=1: raise SystemExit(f'expected one fallback, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check src/engine.js
          node tests/v11-state-regression.mjs
          node tests/spatial-floor-boundaries.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.js
          git commit -m "fix: preserve legacy XY fallback in spatial arrival"
          git push origin HEAD:feat/v11.11.3-node-aware-floor-effects
