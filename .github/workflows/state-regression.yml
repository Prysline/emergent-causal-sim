      - run: node tests/memory-deliberation-influence.mjs
      - run: node tests/requester-social-outcome-memory.mjs
      - run: node tests/animal-social-outcome-memory.mjs
      - run: node tests/relationship-foundation-v1150.mjs
      - run: node tests/relationship-target-preference-v1151.mjs
