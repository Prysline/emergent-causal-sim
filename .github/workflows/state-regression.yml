name: State regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  state-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/v104-stuck-debug.mjs
      - run: node tests/state-regression.mjs
