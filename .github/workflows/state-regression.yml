name: State regression
on:
  push:
    branches: [main, 'refactor/**', 'fix/**']
  workflow_dispatch:
jobs:
  state-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in src/*.js; do node --check "$f"; done
      - run: node tests/v11-state-regression.mjs
