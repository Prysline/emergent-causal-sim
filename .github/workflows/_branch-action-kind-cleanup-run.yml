name: Run branch action.kind cleanup
on:
  push:
    branches: [refactor/remove-action-intent-compat]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-action-intent-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup and focused regressions
        run: |
          node scripts/_branch_action_kind_prep.cjs
          node scripts/_branch_action_kind_cleanup.cjs
          node --check src/engine.js
          node --check src/action-runtime-v1120.js
          node tests/action-terminology.mjs
          node tests/action-construction.mjs
          node tests/runtime-hook-pipeline.mjs
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refactor Action runtime to canonical kind only"
          git push origin HEAD:refactor/remove-action-intent-compat
