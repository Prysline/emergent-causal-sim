name: Temporary activity concurrency sync

on:
  push:
    branches: [activity-concurrency-eating-social]
    paths: [.github/workflows/temp-activity-concurrency-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activity-concurrency-eating-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync current release assertions and docs
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';

          const CURRENT='11.51.0-activity-concurrency';
          const PREVIOUS='11.50.1-prone-transition-burden';
          const workflow=fs.readFileSync('.github/workflows/node-regression.yml','utf8');
          const tests=[...workflow.matchAll(/node (tests\/[A-Za-z0-9._/-]+\.mjs)/g)].map(m=>m[1]);

          function writeIfChanged(path,before,after){
            if(after!==before){fs.writeFileSync(path,after);console.log('updated',path);}
          }
          function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

          for(const path of tests){
            if(path==='tests/test-profile-composition.mjs')continue;
            const before=fs.readFileSync(path,'utf8');
            let source=before;
            const constants=new Map([...source.matchAll(/\bconst\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*=\s*['"]([^'"]+)['"]/g)].map(m=>[m[1],m[2]]));
            const identifiers=new Set();
            for(const match of source.matchAll(/assert\.(?:equal|strictEqual)\((st\.version|E\.VERSION|E\.getState\(\)\.version),\s*([^,\n\)]+)/g)){
              const token=match[2].trim();
              const literal=token.match(/^['"]([^'"]+)['"]$/);
              const expected=literal?literal[1]:constants.get(token);
              if(!expected||expected===CURRENT)continue;
              if(expected!==PREVIOUS)throw new Error(`${path}: unexpected stale overall marker ${expected} via ${token}`);
              if(literal){
                const assertion=new RegExp(`(assert\\.(?:equal|strictEqual)\\((?:st\\.version|E\\.VERSION|E\\.getState\\(\\)\\.version),\\s*['"])${esc(PREVIOUS)}(['"])`,'g');
                source=source.replace(assertion,`$1${CURRENT}$2`);
              }else identifiers.add(token);
            }
            for(const id of identifiers){
              const re=new RegExp(`(\\bconst\\s+${esc(id)}\\s*=\\s*['"])${esc(PREVIOUS)}(['"])`,'g');
              if(!re.test(source))throw new Error(`${path}: cannot locate ${id} declaration for overall marker update`);
              source=source.replace(re,`$1${CURRENT}$2`);
            }
            writeIfChanged(path,before,source);
          }

          {
            const path='docs/architecture.md',before=fs.readFileSync(path,'utf8');let source=before;
            const oldCurrent="> Current `11.50.1-prone-transition-burden`: Locomotion keeps per-meter crawl burden and route feasibility unchanged but raises any transition entering or leaving `proneCrawl` to objective burden 2; `walk <-> kneelCrawl` remains 1. Short prone shortcuts must therefore justify both getting down and getting back up instead of winning over a small walk detour.";
            const newCurrent="> Previous `11.50.1-prone-transition-burden`: Locomotion keeps per-meter crawl burden and route feasibility unchanged but raises any transition entering or leaving `proneCrawl` to objective burden 2; `walk <-> kneelCrawl` remains 1. Short prone shortcuts must therefore justify both getting down and getting back up instead of winning over a small walk detour.\n\n> Current `11.51.0-activity-concurrency`: Action runtime now owns a minimal generic compatibility seam for one ongoing primary Action plus one execution-local transient behavior. Eating remains the sole owner of food/progress/completion; Human Social uses `socialListening` with progress scale 1 and `socialSpeaking` with scale 0 for that execution tick. Social Bid / response / canonical `talk` provenance is unchanged, no persistent Conversation truth is introduced, and incompatible sleeping + speaking still requires formal wake / transition.";
            if(!source.includes(oldCurrent))throw new Error('architecture current release paragraph not found');
            source=source.replace(oldCurrent,newCurrent);
            const marker='目前 runtime marker：`11.50.1-prone-transition-burden`。';
            if(!source.includes(marker))throw new Error('architecture current marker not found');
            source=source.replace(marker,'目前 runtime marker：`11.51.0-activity-concurrency`。\n\nActivity Concurrency v1 不建立第二份 primary progress truth，也不建立任意 N-channel scheduler。compatibility / transient record 是 execution-local 協調資料；Eating 的 canonical Action / Intent identity 保留，Human Social 仍透過既有 World Event / observation / responder agency lifecycle 形成結果。');
            writeIfChanged(path,before,source);
          }

          {
            const path='docs/versioning.md',before=fs.readFileSync(path,'utf8');let source=before;
            if(!source.startsWith('`11.50.1-prone-transition-burden`'))throw new Error('versioning top marker changed unexpectedly');
            source=source.replace('`11.50.1-prone-transition-burden`','`11.51.0-activity-concurrency`');
            const oldCurrent='Current release: Locomotion calibrates objective mode-transition burden so entering or leaving `proneCrawl` costs 2 while `walk <-> kneelCrawl` remains 1. Per-meter crawl burden, timing, feasibility and subjective route preference are unchanged; sufficiently long detours may still make crawling the lower objective-cost route.';
            const newCurrent='Current release: Activity Concurrency v1 adds a minimal generic ongoing-primary + execution-local transient compatibility/progress-interference seam. Eating remains the sole owner of food consumption and completion; Human Social listening keeps local eating progress at scale 1 while speaking pauses it at scale 0 for that execution tick. Existing Social Bid / canonical response / talk provenance remains authoritative; no persistent Conversation truth or arbitrary N-channel scheduler is introduced.';
            if(!source.includes(oldCurrent))throw new Error('versioning current summary not found');
            source=source.replace(oldCurrent,newCurrent);
            const oldPrev='Previous release: `11.50.0-agent-turn-execution` established explicit Agent turn execution and deterministic angular burden.';
            if(!source.includes(oldPrev))throw new Error('versioning previous summary not found');
            source=source.replace(oldPrev,'Previous release: `11.50.1-prone-transition-burden` calibrated objective prone transition burden without changing per-meter crawl burden, timing or feasibility.\n\nPrevious release before that: `11.50.0-agent-turn-execution` established explicit Agent turn execution and deterministic angular burden.');
            const currentMarker=/目前 current runtime marker：\r?\n\r?\n`11\.50\.1-prone-transition-burden`/;
            if(!currentMarker.test(source))throw new Error('versioning current marker block not found');
            source=source.replace(currentMarker,'目前 current runtime marker：\n\n`11.51.0-activity-concurrency`');
            source=source.replace('玩家可見的 app 頁首 current-version display 使用短版 `v11.50.1`；','玩家可見的 app 頁首 current-version display 使用短版 `v11.51.0`；');
            source=source.replace('Current subsystem markers：Resources','Current subsystem markers：Action `11.51.0-activity-concurrency`；Human Social Response `11.51.0-activity-concurrency`；Resources');
            const proneHeader='### Current prone transition burden release';
            if(!source.includes(proneHeader))throw new Error('versioning prone current section not found');
            const currentSection=`### Current activity concurrency release\n\n\`11.51.0-activity-concurrency\` establishes the first minimal generic Activity Concurrency contract. \`src/systems/action/runtime.js\` owns explicit compatibility registration plus one execution-local transient record; it does not own primary-domain progress or completion. The first consumer is Eating × Human Social: \`socialListening\` is compatible at \`primaryProgressScale = 1\`, while \`socialSpeaking\` uses \`0\` so speaking pauses only that core execution tick. After the Social transient settles, the original eating Action / Intent continues remaining progress.\n\nHuman Social still emits and consumes the existing canonical \`talkOffer → responder response → talk\` World Event chain. The transient record is not a Conversation object, is not persisted into Agent/World state, and is cleared after its execution tick. Sleeping + speaking has no compatibility rule and therefore remains transition-required. No new runtime hook is added: existing beforeTick 300 \`humanSocial.prepare\`, core Action execution, and afterTick 700 \`humanSocial.resolve\` define deterministic same-tick ordering.\n\nVersion impact：overall / Presentation、Action、Human Social Response → \`11.51.0-activity-concurrency\`。Social Bid remains \`11.47.0-social-bid-carry-cooperation\`；Deliberation / Decision Evidence / Sleep Slot Conflict remains \`11.48.1-sleep-perception-approach\`；Locomotion remains \`11.50.1-prone-transition-burden\`；Physical、Agent Carry、Spatial / Route、Memory / Usage、Affect、Relationship、World Authoring、Furniture Catalog、Embodiment Capabilities are unchanged and are not formally bumped.\n\n### Previous prone transition burden release`;
            source=source.replace(proneHeader,currentSection);
            writeIfChanged(path,before,source);
          }

          {
            const path='docs/tick-pipeline.md',before=fs.readFileSync(path,'utf8');
            const source=before.replace('handler看見 UI-only intermediate batch context標示 intermediate時','handler看見 UI-only intermediate batch context時');
            writeIfChanged(path,before,source);
          }

          console.log('release/docs synchronization complete');
          '@ | Set-Content -Encoding utf8 .temp-activity-sync.mjs
          node .temp-activity-sync.mjs
          Remove-Item .temp-activity-sync.mjs
      - name: Focused preflight
        shell: pwsh
        run: |
          node tests/check-source-syntax.mjs
          node tests/activity-concurrency-eating-social.mjs
          node tests/test-profile-composition.mjs
          node tests/pr-preflight.mjs
          git diff --check
      - name: Commit branch synchronization
        shell: pwsh
        run: |
          git config user.name "activity-concurrency-sync"
          git config user.email "activity-concurrency-sync@users.noreply.github.com"
          git add README.md docs/architecture.md docs/versioning.md docs/tick-pipeline.md tests
          if (git diff --cached --quiet) { Write-Host 'No synchronization changes'; exit 0 }
          git commit -m "Sync activity concurrency release markers and docs"
          git push origin HEAD:activity-concurrency-eating-social
