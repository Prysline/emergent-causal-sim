name: Branch carrying replanning sync

on:
  push:
    branches:
      - feature/carrying-state-replanning

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carrying-state-replanning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply carrying-state replanning implementation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const OLD='11.47.0-social-bid-carry-cooperation';
          const NEXT='11.48.0-carrying-replanning';
          function read(p){return fs.readFileSync(p,'utf8');}
          function write(p,s){fs.writeFileSync(p,s);}
          function replaceOnce(p,oldText,newText){const s=read(p);if(!s.includes(oldText))throw new Error(`missing patch anchor in ${p}: ${oldText.slice(0,80)}`);write(p,s.replace(oldText,newText));}

          replaceOnce('src/release.js',`const VERSION='${OLD}';`,`const VERSION='${NEXT}';`);
          replaceOnce('src/systems/intent/state.js',`const DELIBERATION_VERSION='${OLD}';`,`const DELIBERATION_VERSION='${NEXT}';`);
          replaceOnce('src/systems/intent/deliberation.js',`const VERSION=W.DELIBERATION_SCHEMA_VERSION||'${OLD}';`,`const VERSION=W.DELIBERATION_SCHEMA_VERSION||'${NEXT}';`);

          const replanning='src/systems/intent/replanning.js';
          replaceOnce(replanning,
            `  const MAX_REPLAN_ATTEMPTS=3;\n  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));`,
            `  const MAX_REPLAN_ATTEMPTS=3;\n  const CARRY_WAIT_TICKS=2,CARRY_WAIT_BASE_UTILITY=20,CARRY_NEUTRAL_PLACEMENT_BASE_UTILITY=45,CARRY_NO_PLACEMENT_WAIT_BONUS=30;\n  const carryingDecisionOptionProviders=[];\n  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));\n  function registerCarryingDecisionOptionProvider(id,provider,order=0){if(!id||typeof provider!=='function')throw new Error('carrying decision option provider requires id + function');if(carryingDecisionOptionProviders.some(x=>x.id===id))throw new Error(\`duplicate carrying decision option provider: \${id}\`);const entry={id,provider,order:Number(order)||0};carryingDecisionOptionProviders.push(entry);carryingDecisionOptionProviders.sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id));return entry;}\n  function listCarryingDecisionOptionProviders(){return carryingDecisionOptionProviders.map(({id,order})=>({id,order}));}`);

          replaceOnce(replanning,
            `  function planOpenIntents(st){for(const a of Object.values(st.agents||{}))planOpenIntent(st,a);}\n  function prepareTick(st){applyEmergencyPreemption(st);planOpenIntents(st);return {before:snapshotLiveActions(st),marker:st.events?.[0]?.id||null};}`,
            `  function planOpenIntents(st){for(const a of Object.values(st.agents||{}))planOpenIntent(st,a);}\n  function carryingReplanTrigger(st,a){\n    const A=window.SimAgentCarry,relation=A?.relationForCarrier?.(st,a),p=a?.action;if(!relation||p?.kind!=='carryAgent'||p.phase!=='recoveryBlocked')return null;\n    const waitUntil=Number(p.carryingWaitUntilTick);if(Number.isFinite(waitUntil)&&st.tick<waitUntil)return null;\n    return {reason:Number.isFinite(waitUntil)?'wait-cadence':'placement-invalidation',relation,priorAction:p};\n  }\n  function normalizeCarryingPlacement(target){if(!target||!['floor','slot'].includes(target.kind))return null;return target.kind==='floor'?{kind:'floor',position:clone(target.position)}:{kind:'slot',id:target.id,posture:target.posture||null};}\n  function carryingDecisionOptions(st,a,trigger){\n    const A=window.SimAgentCarry,relation=trigger?.relation||A?.relationForCarrier?.(st,a);if(!relation)return [];const out=[];\n    for(const entry of carryingDecisionOptionProviders){const value=entry.provider(st,a,{relation:clone(relation),trigger:trigger?.reason||null})??[];for(const option of Array.isArray(value)?value:[value]){const targetPlacement=normalizeCarryingPlacement(option?.targetPlacement);if(!targetPlacement||!Number.isFinite(option?.score))continue;out.push({kind:'placement',targetPlacement,score:Number(option.score),contributors:clone(option.contributors||[]),providerId:entry.id});}}\n    const neutral=normalizeCarryingPlacement(A?.recoveryPlacement?.(st,a,{radius:A.RECOVERY_RADIUS}));if(neutral)out.push({kind:'placement',targetPlacement:neutral,score:CARRY_NEUTRAL_PLACEMENT_BASE_UTILITY,contributors:[{kind:'carryingState',key:'neutralSafetyPlacement',role:'placementFallback',relationId:relation.id}],providerId:'agentCarry.neutralSafety'});\n    const hasPlacement=out.some(x=>x.kind==='placement');out.push({kind:'wait',score:CARRY_WAIT_BASE_UTILITY+(hasPlacement?0:CARRY_NO_PLACEMENT_WAIT_BONUS),contributors:[{kind:'carryingState',key:'stationaryWait',role:'fallback',relationId:relation.id,noPlacement:!hasPlacement}]});\n    return out.sort((x,y)=>y.score-x.score||x.kind.localeCompare(y.kind)||JSON.stringify(x.targetPlacement||null).localeCompare(JSON.stringify(y.targetPlacement||null)));\n  }\n  function buildCarryingReplacement(st,a,trigger,choice){\n    const relation=trigger?.relation,prior=trigger?.priorAction;if(!relation||!prior||!choice)return null;const targetPlacement=choice.kind==='placement'?normalizeCarryingPlacement(choice.targetPlacement):normalizeCarryingPlacement(prior.targetPlacement);if(!targetPlacement)return null;\n    const action=E.buildAction?.(a,{id:'carryAgent',targetAgent:relation.carriedAgentId,targetPlacement,originalConflictSlotId:prior.originalConflictSlotId||null,relocationContext:prior.relocationContext||null,relocationOutcome:'failed',carryEstablishedEventId:prior.carryEstablishedEventId||null});if(!action)return null;\n    action.intentId=prior.intentId||a.activeIntent?.id||null;action.recoveryMode=true;action.relocationOutcome='failed';action.relocationFailedEventId=prior.relocationFailedEventId||null;action.carryEstablishedEventId=prior.carryEstablishedEventId||null;action.carryingDecisionKind=choice.kind;\n    if(choice.kind==='wait'){action.phase='recoveryBlocked';action.carryingWaitUntilTick=st.tick+CARRY_WAIT_TICKS;action.recoveryRetryAtTick=action.carryingWaitUntilTick;}\n    return action;\n  }\n  function applyCarryingReplan(st,a){\n    const trigger=carryingReplanTrigger(st,a);if(!trigger)return false;const options=carryingDecisionOptions(st,a,trigger),pick=options[0];if(!pick)return false;const priorDecisionId=E.currentDecisionEvidence?.(a)?.id||a.action?.decisionId||null,next=buildCarryingReplacement(st,a,trigger,pick);if(!next)return false;\n    const intent=a.activeIntent;if(intent)intent.lifecycle='actionBound';a.action=next;const evidence=E.adoptDecisionEvidence?.(st,a,next,{source:{type:'carryingReplan',tick:st.tick,intentKind:intent?.kind||null,trigger:trigger.reason,decisionKind:pick.kind,providerId:pick.providerId||null},contributors:pick.contributors||[],utility:pick.score,priorDecisionId});\n    E.addEvent(\`\${a.name}抱持中重新評估安全放置方案，決定\${pick.kind==='wait'?'先原地等待':'改採新的放置位置'}。\`,'normal',[trigger.priorAction.relocationFailedEventId].filter(Boolean),{actor:a.id,target:trigger.relation.carriedAgentId,action:'carryingReplanDecision',relationId:trigger.relation.id,trigger:trigger.reason,decisionKind:pick.kind,decisionId:evidence?.id||null,priorDecisionId:priorDecisionId||null,providerId:pick.providerId||null,position:E.positionRef(a.position)});return true;\n  }\n  function applyCarryingReplans(st){for(const a of Object.values(st.agents||{}))applyCarryingReplan(st,a);}\n  function prepareTick(st){applyEmergencyPreemption(st);applyCarryingReplans(st);planOpenIntents(st);return {before:snapshotLiveActions(st),marker:st.events?.[0]?.id||null};}`);

          replaceOnce(replanning,
            `  Object.assign(E,{INTERRUPTION_SCHEMA_VERSION:VERSION,REPLAN_SUPPORTED,EMERGENCY_PREEMPTIBLE,MAX_REPLAN_ATTEMPTS,intentStillValid,planOpenIntent,emergencyChoice});`,
            `  Object.assign(E,{INTERRUPTION_SCHEMA_VERSION:VERSION,REPLAN_SUPPORTED,EMERGENCY_PREEMPTIBLE,MAX_REPLAN_ATTEMPTS,CARRY_WAIT_TICKS,CARRY_WAIT_BASE_UTILITY,CARRY_NEUTRAL_PLACEMENT_BASE_UTILITY,CARRY_NO_PLACEMENT_WAIT_BONUS,registerCarryingDecisionOptionProvider,listCarryingDecisionOptionProviders,carryingDecisionOptions,applyCarryingReplan,intentStillValid,planOpenIntent,emergencyChoice});`);

          // Current-marker audit: overall / Deliberation expectations move to 11.48, Social Bid stays on its own 11.47 generation.
          for(const name of fs.readdirSync('tests')){
            if(!name.endsWith('.mjs'))continue;const p=path.join('tests',name);let s=read(p);if(!s.includes(OLD))continue;s=s.replaceAll(OLD,NEXT);s=s.split('\n').map(line=>/(SOCIAL_BID_VERSION|socialBidVersion|SOCIAL_VERSION)/.test(line)?line.replaceAll(NEXT,OLD):line).join('\n');write(p,s);
          }

          // Focused carrying-state regression.
          write('tests/carrying-state-replanning.mjs',`import assert from 'node:assert/strict';\nimport {loadRuntimeProfile} from './helpers/test-profiles.mjs';\n\nglobalThis.window=globalThis;\nloadRuntimeProfile(['world-authoring.js','world-initializer.js','world.js','release.js','systems/resources.js','systems/agent-carry.js','spatial.js','spatial-traversal.js','spatial-agent-carry.js','systems/action/state.js','systems/intent/state.js','systems/social/state.js','systems/physical.js','spatial-passage.js','systems/locomotion.js','engine.js','runtime-hook-pipeline.js','systems/action/runtime.js','systems/intent/runtime.js','systems/intent/decision-evidence.js','systems/intent/replanning.js','validation/registry.js','validation/rules/physical-profile.js','validation/rules/agent-carry.js','validation/rules/intent-active.js','validation/rules/interruption.js']);\n\nconst E=globalThis.SimEngine,A=globalThis.SimAgentCarry,SP=globalThis.SimSpatial,V=globalThis.SimValidator;\nconst noIssues=label=>{const result=V.validateState(E.getState());assert.equal(result.issueCount,0,\`${'${'}label}: ${'${'}result.issues.map(x=>x.code+': '+x.message).join(' | ')}\`);};\nassert.equal(E.DELIBERATION_SCHEMA_VERSION,'${NEXT}');\nassert.deepEqual(E.listCarryingDecisionOptionProviders(),[]);\nassert.throws(()=>E.registerCarryingDecisionOptionProvider('',()=>[]),/requires id/);\nE.registerCarryingDecisionOptionProvider('test.domain',()=>[]);\nassert.throws(()=>E.registerCarryingDecisionOptionProvider('test.domain',()=>[]),/duplicate/);\n\nE.reset(14800);\nlet st=E.getState(),carrier=st.agents.zhen,carried=st.agents.orange;st.agents.zhou.offMap=true;\nconst contact=(SP.agentContactNodes?.(st,carried,carrier)||SP.adjacentWalkable(st,SP.nodeForAgent(st,carried))||[])[0];assert.ok(contact);carrier.position={...contact};carrier.posture={kind:'standing',slotId:null,furnitureId:null};\ncarried.action={kind:'sleep',phase:'sleeping',started:st.tick,sleepTicks:2,wait:0};\nconst established=A.establishCarry(st,carrier,carried);assert.equal(established.ok,true);\ncarrier.activeIntent={id:'intent:zhen:0:sleep:test',kind:'sleep',createdTick:0,lifecycle:'actionBound',source:{type:'test'}};\ncarrier.action=E.buildAction(carrier,{id:'carryAgent',targetAgent:carried.id,targetPlacement:{kind:'floor',position:{x:-999,y:-999,z:0,spaceId:'home',surfaceId:'floor'}},relocationContext:'sleepSlotConflict',relocationOutcome:'failed'});assert.ok(carrier.action);carrier.action.intentId=carrier.activeIntent.id;carrier.action.phase='recoveryBlocked';carrier.action.recoveryMode=true;carrier.action.relocationOutcome='failed';carrier.action.relocationFailedEventId=E.addEvent('test relocation failure','normal',[],{actor:carrier.id,target:carried.id,action:'agentRelocationFailed'});carrier.action.recoveryRetryAtTick=st.tick+2;\nconst prior=E.adoptDecisionEvidence(st,carrier,carrier.action,{source:{type:'test',tick:st.tick,intentKind:'sleep'},contributors:[]}).id;\nassert.equal(E.applyCarryingReplan(st,carrier),true,'placement invalidation should enter carrying-state deliberation');\nassert.equal(carrier.action?.kind,'carryAgent');assert.equal(carrier.action?.recoveryMode,true);assert.equal(carrier.action?.relocationOutcome,'failed');assert.notEqual(carrier.action?.decisionId,prior);assert.equal(carrier.decisionEvidence?.priorDecisionId,prior);assert.equal(carrier.decisionEvidence?.source?.type,'carryingReplan');assert.ok(A.relationForCarrier(st,carrier),'replanning must preserve canonical carry relation');\nassert.equal(st.events.some(e=>e.data?.action==='carryingReplanDecision'),true);noIssues('placement carrying replan');\n\n// Force no neutral placement: wait becomes the adopted carrying decision, keeps the relation, and does not enter ordinary soft reconsideration.\nE.reset(14801);st=E.getState();carrier=st.agents.zhen;carried=st.agents.orange;st.agents.zhou.offMap=true;const node=(SP.agentContactNodes?.(st,carried,carrier)||SP.adjacentWalkable(st,SP.nodeForAgent(st,carried))||[])[0];carrier.position={...node};carrier.posture={kind:'standing',slotId:null,furnitureId:null};carried.action={kind:'sleep',phase:'sleeping',started:st.tick,sleepTicks:2,wait:0};assert.equal(A.establishCarry(st,carrier,carried).ok,true);carrier.activeIntent={id:'intent:zhen:0:sleep:wait',kind:'sleep',createdTick:0,lifecycle:'actionBound',source:{type:'test'}};carrier.action=E.buildAction(carrier,{id:'carryAgent',targetAgent:carried.id,targetPlacement:{kind:'floor',position:{x:-999,y:-999,z:0,spaceId:'home',surfaceId:'floor'}},relocationOutcome:'failed'});carrier.action.intentId=carrier.activeIntent.id;carrier.action.phase='recoveryBlocked';carrier.action.recoveryMode=true;carrier.action.relocationOutcome='failed';\nconst originalRecovery=A.recoveryPlacement;A.recoveryPlacement=()=>null;\ntry{const priorWait=E.adoptDecisionEvidence(st,carrier,carrier.action,{source:{type:'test',tick:st.tick,intentKind:'sleep'}}).id;assert.equal(E.applyCarryingReplan(st,carrier),true);assert.equal(carrier.action?.phase,'recoveryBlocked');assert.equal(carrier.action?.carryingDecisionKind,'wait');assert.equal(carrier.action?.carryingWaitUntilTick,st.tick+E.CARRY_WAIT_TICKS);assert.notEqual(carrier.action?.decisionId,priorWait);assert.equal(carrier.decisionEvidence?.priorDecisionId,priorWait);assert.ok(A.relationForCarrier(st,carrier));assert.equal(E.SOFT_RECONSIDERABLE_ACTIONS?.has('carryAgent')||false,false);assert.equal(E.applyCarryingReplan(st,carrier),false,'wait must not rerank before cadence expires');st.tick=carrier.action.carryingWaitUntilTick;assert.equal(E.applyCarryingReplan(st,carrier),true,'wait cadence should trigger a fresh carrying decision');assert.equal(carrier.decisionEvidence?.source?.trigger,'wait-cadence');assert.ok(A.relationForCarrier(st,carrier));}finally{A.recoveryPlacement=originalRecovery;}\nnoIssues('stationary carry wait');\nconsole.log('carrying-state generic re-deliberation regression: ok');\n`);

          // Current docs: prepend/adjust current descriptions, keep older 11.47 history intact.
          replaceOnce('README.md',`目前 runtime marker：**v11.47.0・Social Bid responder contract × awake cooperative carry** (\`${OLD}\`)。`,`目前 runtime marker：**v11.48.0・carrying-state generic re-deliberation** (\`${NEXT}\`)。`);
          let versioning=read('docs/versioning.md');versioning=`\`${NEXT}\`\n\nCurrent release: Deliberation now supports generic carrying-state re-deliberation after a post-pickup placement failure. Canonical \`agentCarries\` remains Agent Carry World truth; Deliberation compares a concrete placement proposal with stationary wait, adopts a fresh \`carryAgent\` Action / Decision identity linked by \`priorDecisionId\`, and leaves geometry / route / final placement legality to Agent Carry / Spatial / Physical. The existing \`recoveryBlocked\` lifecycle remains the physical anti-orphan safety net. \`carryAgent\` is not added to ordinary soft reconsideration. Social Bid remains on its own \`11.47.0-social-bid-carry-cooperation\` generation.\n\n`+versioning;write('docs/versioning.md',versioning);
          let tick=read('docs/tick-pipeline.md');tick=`> Current \`${NEXT}\`: beforeTick order 800 \`intent.replan-preemption\` now also owns carrying-state re-deliberation before the core loop. It only runs from explicit carrying invalidation / wait-cadence triggers, creates a replacement \`carryAgent\` Decision when adopted, and does not make carrying part of ordinary order-700 soft reconsideration. Existing \`recoveryBlocked\` remains the core physical safety fallback if cognition cannot adopt a replacement.\n\n`+tick;write('docs/tick-pipeline.md',tick);
          let arch=read('docs/architecture.md');arch=`> Current \`${NEXT}\`: Deliberation may plan while a canonical \`agentCarries\` relation exists, but it never owns or mirrors that relation. Carrying-state replanning is Agent-private cognition over placement/wait candidates; Agent Carry / Spatial / Physical retain World-truth execution, geometry, route and placement legality. Replacement plans use new Decision identities with \`priorDecisionId\`; \`recoveryBlocked\` remains the anti-orphan physical fallback.\n\n`+arch;write('docs/architecture.md',arch);
          let carry=read('docs/agent-carry-relocate.md');carry=carry.replace('forced relocation / combat / restraint 與 awake cooperation 仍不在目前範圍。','forced relocation / combat / restraint 仍不在目前範圍；awake cooperative carry 已由 11.47 Social Bid responder contract 接入。');carry=`## 11.48 carrying-state re-deliberation integration\n\nPost-pickup placement invalidation now exposes an explicit Deliberation carrying context before physical fallback. Deliberation may adopt a fresh \`carryAgent\` placement plan or stationary wait while the canonical \`agentCarries\` relation remains unchanged. Every adopted replacement receives a new Decision identity and may link to the prior decision through \`priorDecisionId\`. Domain policy may register semantic placement proposals; the existing Agent Carry neutral recovery placement query supplies the generic safety proposal. Spatial / Route / Physical remain the only geometry / accessibility / legality authorities. \`recoveryBlocked\` is retained as the anti-orphan safety net and recovery completion never becomes original relocation success.\n\n`+carry;write('docs/agent-carry-relocate.md',carry);

          // Sanity: Social Bid production generation must not be fake-bumped.
          if(!read('src/systems/social/state.js').includes(`SOCIAL_BID_VERSION='${OLD}'`))throw new Error('Social Bid own generation changed unexpectedly');
          NODE
      - name: Static syntax and focused regressions
        run: |
          node --check src/systems/intent/replanning.js
          node --check src/systems/intent/state.js
          node --check src/systems/intent/deliberation.js
          node tests/carrying-state-replanning.mjs
          node tests/intent-replan-preemption.mjs
          node tests/decision-evidence.mjs
          node tests/agent-carry-relocate.mjs
          node tests/soft-reconsideration-hysteresis.mjs
      - name: Commit synchronized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md docs
          git commit -m 'Implement carrying-state generic re-deliberation'
          git push origin HEAD:feature/carrying-state-replanning