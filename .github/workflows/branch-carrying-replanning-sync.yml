name: Branch carrying replanning sync

on:
  push:
    branches:
      - feature/carrying-state-replanning

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carrying-state-replanning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize current README marker punctuation for patching
        run: sed -i 's/（`11.47.0-social-bid-carry-cooperation`）/ (`11.47.0-social-bid-carry-cooperation`)/' README.md
      - name: Apply carrying-state replanning implementation
        id: patch
        shell: bash
        run: |
          set +e
          node .github/scripts/branch-carrying-replanning-sync.cjs > .sync-log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat .sync-log.txt
          exit 0
      - name: Persist patch diagnostics on failure
        if: steps.patch.outputs.exit_code != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .sync-log.txt .github/carrying-replanning-sync.log
          git add .github/carrying-replanning-sync.log
          git commit -m 'Record carrying replanning sync failure'
          git push origin HEAD:feature/carrying-state-replanning
      - name: Stop on patch failure
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
      - name: Static syntax and focused regressions
        run: |
          node --check src/engine.js
          node --check src/systems/intent/replanning.js
          node --check src/systems/intent/decision-evidence.js
          node --check src/systems/intent/state.js
          node --check src/systems/intent/deliberation.js
          node tests/carrying-state-replanning.mjs
          node tests/intent-replan-preemption.mjs
          node tests/decision-evidence.mjs
          node tests/agent-carry-relocate.mjs
          node tests/soft-reconsideration-hysteresis.mjs
      - name: Commit synchronized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md docs
          git commit -m 'Implement carrying-state generic re-deliberation'
          git push origin HEAD:feature/carrying-state-replanning