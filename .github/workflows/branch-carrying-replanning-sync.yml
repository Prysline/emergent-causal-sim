name: Branch carrying replanning sync

on:
  push:
    branches:
      - feature/carrying-state-replanning

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carrying-state-replanning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply carrying-state replanning implementation
        run: node .github/scripts/branch-carrying-replanning-sync.cjs
      - name: Static syntax and focused regressions
        run: |
          node --check src/engine.js
          node --check src/systems/intent/replanning.js
          node --check src/systems/intent/decision-evidence.js
          node --check src/systems/intent/state.js
          node --check src/systems/intent/deliberation.js
          node tests/carrying-state-replanning.mjs
          node tests/intent-replan-preemption.mjs
          node tests/decision-evidence.mjs
          node tests/agent-carry-relocate.mjs
          node tests/soft-reconsideration-hysteresis.mjs
      - name: Commit synchronized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md docs
          git commit -m 'Implement carrying-state generic re-deliberation'
          git push origin HEAD:feature/carrying-state-replanning