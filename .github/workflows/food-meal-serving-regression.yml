name: Food Meal Serving Node regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: food-meal-serving-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  food-meal-serving:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/food-meal-serving.mjs
