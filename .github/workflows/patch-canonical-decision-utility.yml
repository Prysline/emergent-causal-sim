name: Patch canonical decision utility

on:
  push:
    branches:
      - "refactor/canonical-decision-utility"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-decision-utility
      - name: Apply exact engine patch
        run: python scripts/patch-canonical-decision-utility.py
      - name: Validate and commit
        run: |
          node --check src/engine.js
          rm .github/workflows/patch-canonical-decision-utility.yml scripts/patch-canonical-decision-utility.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.js .github/workflows/patch-canonical-decision-utility.yml scripts/patch-canonical-decision-utility.py
          git commit -m "Extract canonical species-aware decision utility"
          git push origin HEAD:refactor/canonical-decision-utility
