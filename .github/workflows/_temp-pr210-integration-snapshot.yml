name: Temporary PR210 integration cleanup
permissions:
  contents: write
on:
  push:
    branches:
      - mental-regulation-need-generation-v1
jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mental-regulation-need-generation-v1
          fetch-depth: 0
      - name: Apply validated cleanup patch and self-remove
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/pr210-cleanup.patch
          git apply --check /tmp/pr210-cleanup.patch
          git apply /tmp/pr210-cleanup.patch
          rm .github/workflows/_temp-pr210-integration-snapshot.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Decouple regression tests from overall release literal"
          git push origin HEAD:mental-regulation-need-generation-v1
