name: Reading activity implementation bootstrap

on:
  push:
    branches: [reading-activity-readable-object-v1]

permissions:
  contents: write

jobs:
  implement:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal reading activity slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def text(path): return Path(path).read_text()
          def write(path, value): Path(path).write_text(value)
          def rep(path, old, new, expected=1):
              s=text(path); n=s.count(old)
              if n != expected: raise SystemExit(f'{path}: expected {expected} occurrences, found {n}: {old[:100]!r}')
              write(path, s.replace(old,new,expected))
          def sub(path, pattern, repl, expected=1, flags=0):
              s=text(path); out,n=re.subn(pattern,repl,s,count=expected,flags=flags)
              if n != expected: raise SystemExit(f'{path}: expected {expected} regex replacements, found {n}: {pattern}')
              write(path,out)

          # World Authoring: formal ordinary-object collection and one concrete readable object.
          rep('src/world-authoring.js', "const VERSION='world-authoring-v12';", "const VERSION='world-authoring-v13';")
          rep('src/world-authoring.js', "    entities:{\n      containers:{", "    entities:{\n      objects:{\n        bookA:{id:'bookA',name:'一本書',icon:'📖',affordances:['read'],position:pos(5,2),supportId:'diningTable',interactions:{read:{mode:'supportReach'}}}\n      },\n      containers:{")
          ordinary_validation = """    const ordinaryObjects=authoring.entities?.objects||{},containerEntries=authoring.entities?.containers||{},sourceEntries=authoring.entities?.sources||{};
