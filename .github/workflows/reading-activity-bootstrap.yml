      if(!SP.isAtInteraction(state,a,target,'read')){p.phase='move';return;}
      p.feedbackUnits=(p.feedbackUnits||0)+1;
      if(p.feedbackUnits>=(p.feedbackGoal||6)){addEvent(`${a.name}讀了一會兒${object.name}。`,'good',[],{actor:a.id,action:'read',target:object.id,feedbackUnits:p.feedbackUnits,entities:[`object:${object.id}`],position:positionRef(a.position)});finishAction(a,{dropHeld:false});}
      return;
    }
    abortAction(a,'未知的閱讀階段',{dropHeld:false});
  }
"""
          rep('src/engine.js', "  function stepWander(a,p){", read_step+"  function stepWander(a,p){")
          rep('src/engine.js', "case'groom':stepGroom(a,p);break;case'wander':stepWander(a,p);break;", "case'groom':stepGroom(a,p);break;case'read':stepRead(a,p);break;case'wander':stepWander(a,p);break;")

          # Human-readable Action / Intent vocabulary and activity-specific capability marker.
          rep('src/world.js', "groom:'舔毛清潔',wander:'閒晃',externalSupply:'外出補給'", "groom:'舔毛清潔',read:'閱讀',wander:'閒晃',externalSupply:'外出補給'")
          rep('src/systems/intent/runtime.js', "    wander:'explore',restockContainer:'restockResource',externalSupply:'replenishSupply'", "    read:'read',wander:'explore',restockContainer:'restockResource',externalSupply:'replenishSupply'")
          rep('src/systems/intent/runtime.js', "    explore:'探索環境',restockResource:'補充容器資源'", "    read:'閱讀',explore:'探索環境',restockResource:'補充容器資源'")
          rep('src/systems/action/runtime.js', "  Object.assign(E,{ACTION_SCHEMA_VERSION:VERSION,", "  Object.assign(E,{ACTION_SCHEMA_VERSION:VERSION,READ_ACTIVITY_VERSION:'read-activity-v1',")

          # Mental Regulation owns the regulation profile and realized-effect consumption, not Action progress.
          rep('src/systems/mental-regulation/state.js', "const VERSION='mental-regulation-v1';", "const VERSION='mental-regulation-v2';")
          rep('src/systems/mental-regulation/state.js', "    wander:Object.freeze({engagementProvision:1.4,mentalLoad:.12,relaxationProvision:.5})", "    wander:Object.freeze({engagementProvision:1.4,mentalLoad:.12,relaxationProvision:.5}),\n    read:Object.freeze({engagementProvision:1.8,mentalLoad:.35,relaxationProvision:.65})")
          rep('src/systems/mental-regulation/runtime.js', "  E.registerDecisionOptionProvider('mentalRegulation.wander',(st,a)=>M.decisionOptionFor(a,'wander'),450);", """  E.registerDecisionOptionProvider('mentalRegulation.wander',(st,a)=>M.decisionOptionFor(a,'wander'),450);
  E.registerDecisionOptionProvider('mentalRegulation.read',(st,a)=>{
    const option=M.decisionOptionFor(a,'read');if(!option)return null;
    const candidates=Object.values(st.objects||{}).filter(object=>object?.affordances?.includes('read')).map(object=>{const result=SP.bestInteractionPositionResult?.(st,a,{kind:'object',id:object.id},'read');return result&&Number.isFinite(result.traversalCost)?{object,result}:null;}).filter(Boolean).sort((x,y)=>x.result.traversalCost-y.result.traversalCost||String(x.object.id).localeCompare(String(y.object.id)));
    const best=candidates[0];if(!best)return null;
    const traversalCost=best.result.traversalCost,accessPenalty=Math.min(18,traversalCost*1.5);
    return {...option,targetObject:best.object.id,score:Math.max(0,option.score-accessPenalty),decisionContributors:[...(option.decisionContributors||[]),{kind:'spatial',key:'readAccessTraversalCost',role:'cost',value:traversalCost}]};
  },455);""")
          rep('src/systems/mental-regulation/runtime.js', "    ctx.locals.mentalRegulationExecution=executingWander;", """    ctx.locals.mentalRegulationExecution=executingWander;
    const executingRead=Object.create(null);
    for(const a of Object.values(st?.agents||{}))if(a.action?.kind==='read'&&a.action.phase==='reading')executingRead[a.id]={action:a.action,feedbackUnits:Number(a.action.feedbackUnits)||0};
    ctx.locals.mentalRegulationReadExecution=executingRead;""")
          rep('src/systems/mental-regulation/runtime.js', "    for(const [agentId,positionBefore] of Object.entries(before)){\n      const a=st?.agents?.[agentId];\n      if(!a?.position||samePosition(positionBefore,a.position))continue;\n      M.applyRealizedActivityFeedback(a,'wander',{feedbackUnits:1});\n    }", """    for(const [agentId,positionBefore] of Object.entries(before)){
      const a=st?.agents?.[agentId];
      if(!a?.position||samePosition(positionBefore,a.position))continue;
      M.applyRealizedActivityFeedback(a,'wander',{feedbackUnits:1});
    }
    for(const [agentId,capture] of Object.entries(ctx.locals.mentalRegulationReadExecution||{})){
      const a=st?.agents?.[agentId],realized=Math.max(0,(Number(capture.action?.feedbackUnits)||0)-capture.feedbackUnits);
      if(!a||realized<=0)continue;
      M.applyRealizedActivityFeedback(a,'read',{feedbackUnits:realized});
    }""")

          # Existing wander regression remains focused on wander; new reading regression covers the new consumer.
          rep('tests/mental-regulation-engagement-relaxation.mjs', "'mental-regulation-v1'", "'mental-regulation-v2'", expected=3)
          rep('tests/mental-regulation-engagement-relaxation.mjs', "for(const other of Object.values(st.agents))if(other.id!==a.id)other.offMap=true;", "for(const other of Object.values(st.agents))if(other.id!==a.id)other.offMap=true;\ndelete st.objects.bookA;")

          # Current World Authoring assertions/fixtures follow the formal schema bump; archived prose is intentionally not blind-replaced.
          for path in Path('tests').glob('*.mjs'):
              s=path.read_text()
              if 'world-authoring-v12' in s:path.write_text(s.replace('world-authoring-v12','world-authoring-v13'))
          rep('README.md', 'schema generation 為 `world-authoring-v12`', 'schema generation 為 `world-authoring-v13`')
          rep('README.md', '`world-authoring-v12` 的 Furniture Instance', '`world-authoring-v13` 的 Furniture Instance')
          rep('docs/versioning.md', 'World Authoring = `world-authoring-v12`，Furniture Catalog', 'World Authoring = `world-authoring-v13`，Furniture Catalog')

          # Focused regression for ordinary-object authority + sustained read execution + realized Mental Regulation effects.
          Path('tests/mental-regulation-reading-activity.mjs').write_text(r'''import assert from 'node:assert/strict';
import {loadProductionBefore} from './helpers/production-loader.mjs';

globalThis.window=globalThis;
loadProductionBefore('src/ui/core.js');

const E=globalThis.SimEngine,M=globalThis.SimMentalRegulation,SP=globalThis.SimSpatial,A=globalThis.SimWorldAuthoring,V=globalThis.SimValidator;
assert.equal(A.VERSION,'world-authoring-v13');
assert.equal(M.VERSION,'mental-regulation-v2');
