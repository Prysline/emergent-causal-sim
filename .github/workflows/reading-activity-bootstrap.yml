          rep('src/world-initializer.js', "      containers:buildContainers(authoring),\n      sources:buildSources(authoring),", "      objects:buildObjects(authoring),\n      containers:buildContainers(authoring),\n      sources:buildSources(authoring),")

          # Base Spatial interaction geometry: kind:'object' resolves ordinary objects or Containers without conflating ownership.
          rep('src/spatial.js', "  function objectPosition(st,id){const c=st.containers?.[id];if(c){const holder=holderOf(st,id);return holder?clonePos(holder.position):clonePos(c.position);}return clonePos(st.sources?.[id]?.position);}", "  function objectPosition(st,id){const c=st.containers?.[id];if(c){const holder=holderOf(st,id);return holder?clonePos(holder.position):clonePos(c.position);}const object=st.objects?.[id];if(object)return clonePos(object.position);return clonePos(st.sources?.[id]?.position);}")
          sub('src/spatial.js', r"    if\(target\.kind==='object'\)\{\n.*?\n    \}\n    if\(target\.kind==='source'\)\{", """    if(target.kind==='object'){
      const c=st.containers?.[target.id],object=st.objects?.[target.id],entity=object||c;if(!entity)return {mode:'none',positions:[],target,affordance};const holder=c?holderOf(st,target.id):null,p=objectPosition(st,target.id);if(!p)return {mode:'none',positions:[],target,affordance};
      if(holder){const positions=holder.id===agent?.id?[clonePos(agent.position)]:reachPositions(st,p);return {mode:'heldReach',positions,target,affordance,holderId:holder.id};}
      const rule=interactionRule(entity,affordance);
      if(rule?.mode==='port'){const positions=interactionPortPositions(st,entity,affordance);return {mode:'port',positions,target,affordance,ports:entity.interactionPorts||[]};}
      if(rule?.mode==='supportReach'&&entity.supportId)return {mode:'supportReach',positions:supportReachPositions(st,entity.supportId),target,affordance,supportId:entity.supportId};
      if(rule?.mode==='occupy'&&walkable(st,p))return {mode:'occupy',positions:[clonePos(p)],target,affordance};
      if(rule?.mode==='reach')return {mode:'reach',positions:reachPositions(st,p),target,affordance};
      if(entity.supportId)return {mode:'supportReach',positions:supportReachPositions(st,entity.supportId),target,affordance,supportId:entity.supportId};
      return {mode:'reach',positions:reachPositions(st,p),target,affordance};
    }
    if(target.kind==='source'){""", flags=re.S)

          # Traversal-aware canonical geometry uses the same ordinary-object truth; route semantics themselves stay unchanged.
          rep('src/spatial-traversal.js', "    const c=st.containers?.[id],s=st.sources?.[id],obj=c||s;if(!obj?.position)return null;\n    let surfaceId=obj.position.surfaceId||FLOOR;\n    if(c?.supportId){const entry=supportSurfaceForFurniture(st,c.supportId);if(entry)surfaceId=entry.surface.id;}", "    const c=st.containers?.[id],object=st.objects?.[id],s=st.sources?.[id],obj=c||object||s;if(!obj?.position)return null;\n    let surfaceId=obj.position.surfaceId||FLOOR;\n    if(obj?.supportId){const entry=supportSurfaceForFurniture(st,obj.supportId);if(entry)surfaceId=entry.surface.id;}")
          rep('src/spatial-traversal.js', "      const c=st.containers?.[target.id];if(!c)return {mode:'none',positions:[],target,affordance};\n      const holder=SP.holderOf(st,target.id),node=objectNode(st,target.id);if(!node)return {mode:'none',positions:[],target,affordance};", "      const c=st.containers?.[target.id],object=st.objects?.[target.id],entity=object||c;if(!entity)return {mode:'none',positions:[],target,affordance};\n      const holder=c?SP.holderOf(st,target.id):null,node=objectNode(st,target.id);if(!node)return {mode:'none',positions:[],target,affordance};")
          rep('src/spatial-traversal.js', "      const rule=c.interactions?.[affordance]||c.interactions?.default||null;", "      const rule=entity.interactions?.[affordance]||entity.interactions?.default||null;")
          rep('src/spatial-traversal.js', "      if(rule?.mode==='supportReach'&&c.supportId)return {mode:'supportReach',positions:supportContactNodes(st,c.supportId,agent),target,affordance,supportId:c.supportId};", "      if(rule?.mode==='supportReach'&&entity.supportId)return {mode:'supportReach',positions:supportContactNodes(st,entity.supportId,agent),target,affordance,supportId:entity.supportId};")
          rep('src/spatial-traversal.js', "        if(c.supportId)return {mode:'supportReach',positions:supportContactNodes(st,c.supportId,agent),target,affordance,supportId:c.supportId};", "        if(entity.supportId)return {mode:'supportReach',positions:supportContactNodes(st,entity.supportId,agent),target,affordance,supportId:entity.supportId};")
          rep('src/spatial-traversal.js', "      if(rule?.mode==='reach'||(!rule&&!c.supportId))return {mode:'reach',positions:floorReachNodes(st,node,agent),target,affordance};", "      if(rule?.mode==='reach'||(!rule&&!entity.supportId))return {mode:'reach',positions:floorReachNodes(st,node,agent),target,affordance};")
          rep('src/spatial-traversal.js', "ROUTE_SEMANTICS_VERSION:'11.38.0-carried-handling-risk',", "ORDINARY_OBJECT_INTERACTION_VERSION:'ordinary-object-interaction-v1',ROUTE_SEMANTICS_VERSION:'11.38.0-carried-handling-risk',")

          # Concrete sustained read Action. One valid reading execution tick yields one feedback unit; no Need is written here.
          rep('src/engine.js', "      case'groom':action={...base,phase:'groom'};break;\n      case'wander':", "      case'groom':action={...base,phase:'groom'};break;\n      case'read':{const object=state.objects?.[choice.targetObject],target=object?{kind:'object',id:object.id}:null,valid=a.kind==='human'&&object?.affordances?.includes('read')&&Number.isFinite(targetTraversalCost(a,target,'read'));action=valid?{...base,phase:SP.isAtInteraction(state,a,target,'read')?'reading':'move',targetObject:object.id,feedbackUnits:0,feedbackGoal:6}:null;break;}\n      case'wander':")
          read_step = """  function stepRead(a,p){
    const object=state.objects?.[p.targetObject],target=object?{kind:'object',id:object.id}:null;
    if(a.kind!=='human'||!object?.affordances?.includes('read')){abortAction(a,'原本的閱讀物件已經無法閱讀',{dropHeld:false});return;}
    if(p.phase==='move'){if(!moveToInteraction(a,target,`前往${object.name}的閱讀位置`,'read'))return;p.phase='reading';return;}
