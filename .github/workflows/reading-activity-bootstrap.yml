          Path('docs/reading-activity.md').write_text('''# Reading Activity v1\n\nCurrent capability marker: `read-activity-v1`. World Authoring: `world-authoring-v13`. Mental Regulation: `mental-regulation-v2`. Ordinary-object interaction: `ordinary-object-interaction-v1`.\n\n## Canonical ownership\n\n- `entities.objects -> state.objects` is the canonical ordinary-object path. A readable book is not disguised as a Container or Source.\n- `read` is a sustained Human Action / `read` Intent targeting an ordinary object with the explicit `read` affordance. Target feasibility and access consume canonical Interaction Geometry and `traversalCost`; entity position is not an interaction shortcut.\n- The Action owns reading execution progress only. Each valid `reading` execution tick realizes one feedback unit; merely choosing the Intent, moving toward the target, or holding a timer does not.\n- Mental Regulation owns `ACTIVITY_PROFILES.read` and converts realized feedback into Engagement / Relaxation effects. The Activity never writes Needs directly.\n- Interruption keeps already-realized effects and does not introduce a resume lifecycle.\n\n## First concrete object\n\n`bookA` is authored on the existing dining-table Surface with `interactions.read.mode = supportReach`. Existing Furniture geometry is reused; no read-specific Furniture suitability, seat requirement, hand/gaze model, or new Furniture definition is introduced.\n\n## Deliberation\n\nThe Mental Regulation provider contributes `read` only when canonical Engagement / Relaxation pressure exists and a readable object has finite canonical interaction traversal cost. The nearest reachable readable object is selected deterministically by traversal cost then id; access burden is a bounded decision cost. Neutral `0 / 0` Mental Regulation defaults therefore do not change the default simulation merely because a book exists.\n\n## Deferred\n\nThis slice does not model book content, literacy, genre preference, novelty/familiarity, learning, Memory of content, bookshelves, reading posture, detailed hands/gaze, Environment Interference, generic leisure taxonomy, Mental Need drift, or generic Activity resume/continuity.\n''')
          rep('docs/versioning.md', '### Current activity concurrency release', """### Current Reading Activity capability\n\n`read-activity-v1` adds the first concrete high-information leisure Activity without changing the overall `11.51.0-activity-concurrency` release marker: Mental Regulation still initializes at neutral `0 / 0`, so the new provider remains dormant in the default simulation until canonical pressure exists. World Authoring advances to `world-authoring-v13` for `entities.objects`; Mental Regulation advances to `mental-regulation-v2`; Spatial exposes `ordinary-object-interaction-v1`. Action / Human Social / Route / Furniture generations otherwise remain unchanged.\n\n`read` is a sustained Human Action with a `read` Intent. `bookA` is an ordinary authored object on the existing dining table, not a fake Container/Source. Interaction legality and access use existing Interaction Geometry / traversal cost. One valid reading execution tick is one realized feedback unit; movement, Intent creation, or nominal timers grant no regulation effect. See `docs/reading-activity.md`.\n\n### Current activity concurrency release""")
