name: Branch event observation lifecycle v2 verify

on:
  push:
    branches:
      - refactor/event-observation-lifecycle-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Focused lifecycle regressions
        run: |
          node tests/memory-event-observation-timing.mjs
          node tests/pet-response-observation-timing.mjs
          node tests/episodic-memory-foundation.mjs
          node tests/event-appraisal.mjs
          node tests/short-lived-affect.mjs
          node tests/social-response-agency.mjs
          node tests/human-social-response-agency.mjs
          node tests/memory-deliberation-influence.mjs
          node tests/requester-social-outcome-memory.mjs
          node tests/animal-social-outcome-memory.mjs
          node tests/runtime-hook-pipeline.mjs
          node tests/presentation-observability-v1140.mjs
      - name: Verify ownership cleanup
        run: |
          if grep -Eq 'E\.addEvent\s*=' src/memory-runtime-v1130.js; then
            echo 'Memory runtime still replaces E.addEvent'
            exit 1
          fi
          if grep -q 'memory.capture-events' src/memory-runtime-v1130.js; then
            echo 'legacy memory capture marker still present'
            exit 1
          fi
          if grep -A45 '^## 1\. ' docs/tick-pipeline.md | grep -q 'capture-pet-offers'; then
            echo 'architecture diagram leaked implementation hook ID'
            exit 1
          fi
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_event-observation-v2-verify.yml
          git commit -m 'chore: remove lifecycle verification workflow'
          git push origin HEAD:refactor/event-observation-lifecycle-v2
