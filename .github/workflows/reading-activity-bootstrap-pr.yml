name: Reading activity PR bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  implement:
    if: github.head_ref == 'reading-activity-readable-object-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checked implementation patch
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $extract = @'
          from pathlib import Path
          source=Path('.github/workflows/reading-activity-bootstrap.yml').read_text()
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY\n",start)
          fixed=[]
          for line in source[start:end].splitlines():
              body=line[10:] if line.startswith('          ') else line
              if "ordinary_validation+" in body and "Object.entries(authoring.entities?.containers||{})" in body:
                  target="    for(const [key,container] of Object.entries(authoring.entities?.containers||{})){\n      const basePath=`entities.containers.${key}`;"
                  body=f"rep('src/world-authoring.js', {target!r}, ordinary_validation+{target!r})"
              if "explore:'探索環境'" in body and "restockResource:'補充容器資源'" in body:
                  old="    explore:'探索／閒晃',restockResource:'補充室內資源',replenishSupply:'外出補給'"
                  new="    read:'閱讀',explore:'探索／閒晃',restockResource:'補充室內資源',replenishSupply:'外出補給'"
                  body=f"rep('src/systems/intent/runtime.js', {old!r}, {new!r})"
              fixed.append(body)
          code='\n'.join(fixed)
          exec(compile(code,'reading-activity-bootstrap','exec'),{})
          '@
          $extract | python -
      - name: Restore canonical workflow and verify focused semantics
        shell: pwsh
        run: |
          git restore --source=origin/main -- .github/workflows/node-regression.yml
          node tests/check-source-syntax.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/world-authoring-foundation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/interaction-geometry.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/active-intent-foundation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/mental-regulation-engagement-relaxation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/mental-regulation-reading-activity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary workflows and run preflight
        shell: pwsh
        run: |
          Remove-Item .github/workflows/reading-activity-bootstrap.yml, .github/workflows/reading-activity-bootstrap-pr.yml
          node tests/pr-preflight.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package complete clean implementation
        shell: pwsh
        run: |
          git add -A
          git diff --cached origin/main -- . ':(exclude).github/workflows/*' | Out-File -Encoding utf8 final.patch
          $paths = @(git diff --cached --name-only origin/main -- . ':(exclude).github/workflows/*')
          New-Item -ItemType Directory -Force -Path clean-files | Out-Null
          foreach ($path in $paths) {
            $dest = Join-Path 'clean-files' $path
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $path -Destination $dest
          }
          $paths | Out-File -Encoding utf8 clean-files/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reading-implementation-final
          path: |
            final.patch
            clean-files
