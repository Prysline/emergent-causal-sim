name: v11.13.0 browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: v1130-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && (python3 -m http.server 4173 >/tmp/v1130-http.log 2>&1 &)
      - run: node tests/browser-v1130.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1130-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
