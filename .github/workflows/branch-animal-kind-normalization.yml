name: Branch animal kind normalization
on:
  push:
    branches: [feature/social-bid-carry-cooperation]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-bid-carry-cooperation
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/systems/intent/sleep-conflict.js')
          s=p.read_text()
          old="if(kind==='carryCooperation'&&!['human','animal'].includes(responder.kind))continue;"
          new="if(kind==='carryCooperation'&&responder.kind!=='human'&&!E.isAnimalAgent?.(responder))continue;"
          if old not in s: raise SystemExit('target responder-kind condition not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/systems/intent/sleep-conflict.js
          git commit -m "Normalize animal responder kind for carry cooperation"
          git push origin HEAD:feature/social-bid-carry-cooperation
