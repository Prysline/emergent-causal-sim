name: Inspector presentation lifecycle refactor runner

on:
  push:
    branches:
      - refactor/inspector-presentation-lifecycle

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/inspector-presentation-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic refactor
        run: |
          echo '
' | base64 -d > /tmp/transform.py
          python3 /tmp/transform.py
      - name: Syntax and source regression
        run: |
          for f in src/ui.js src/ui-spatial-observability.js src/ui-spatial-environment.js src/ui-intent-v1121.js src/ui-memory-v1130.js src/ui-appraisal-v1131.js src/ui-affect-v1132.js src/ui-memory-retention-v1133.js src/ui-memory-deliberation-v1134.js src/ui-social-outcome-memory-v1135.js src/ui-resident-view-v1140.js; do node --check "$f"; done
          node tests/presentation-observability-v1140.mjs
      - name: Browser focused regression
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          echo $! > /tmp/emergent-causal-sim-http.pid
          sleep 2
          node tests/browser-resident-view-v1140-qa.mjs
          node tests/browser-runtime-hook-pipeline-qa.mjs
          node tests/browser-observability-controls-qa.mjs
      - name: Commit refactor and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspector-presentation-lifecycle-refactor.yml
          git add src tests docs
          git diff --cached --check
          git commit -m "Refactor Inspector presentation lifecycle"
          git push origin HEAD:refactor/inspector-presentation-lifecycle
