name: Branch carry wait field rename

on:
  push:
    branches: [feature/carrying-state-replanning]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carrying-state-replanning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rename Action-local carry wait field
        run: |
          sed -i 's/carryingWaitUntilTick/carryWaitUntilTick/g' src/engine.js src/systems/intent/replanning.js tests/carrying-state-replanning.mjs
          node --check src/engine.js
          node --check src/systems/intent/replanning.js
          node tests/state-regression.mjs
          node tests/carrying-state-replanning.mjs
      - name: Commit rename
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine.js src/systems/intent/replanning.js tests/carrying-state-replanning.mjs
          git commit -m 'Rename carrying wait Action field'
          git push origin HEAD:feature/carrying-state-replanning