name: Branch overall marker sync

on:
  push:
    branches: [feature/social-bid-carry-cooperation]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-bid-carry-cooperation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync exact overall release assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          old='11.46.0-sleep-carry-integration'
          new='11.47.0-social-bid-carry-cooperation'
          overall_current_files={
            'dynamic-congestion.mjs',
            'presentation-observability.mjs',
            'presentation-event-truth.mjs',
          }
          pat=re.compile(r"(assert\.equal\((?:st\.version|E\.VERSION|E\.getState\(\)\.version)\s*,\s*)'"+re.escape(old)+r"'")
          for p in Path('tests').glob('*.mjs'):
              s=p.read_text()
              s2=pat.sub(lambda m:m.group(1)+"'"+new+"'",s)
              if p.name in overall_current_files:
                  s2=s2.replace("const CURRENT_VERSION='"+old+"';", "const CURRENT_VERSION='"+new+"';")
              if s2!=s:
                  p.write_text(s2)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync overall release assertions"
          git push origin HEAD:feature/social-bid-carry-cooperation
