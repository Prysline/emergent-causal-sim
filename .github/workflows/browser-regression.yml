name: Browser regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!LICENSE'
      - '!tests/**'
      - 'tests/browser-*.mjs'
      - 'tests/helpers/**'
      - '!.github/workflows/node-regression.yml'
      - '!.github/workflows/node-regression-github.yml'
  workflow_dispatch:
    inputs:
      playback_benchmark:
        description: 'Run optional full-render autoplay benchmark'
        type: boolean
        required: false
        default: false
      engine_caller_attribution:
        description: 'Run optional Engine caller attribution (C1; 10 ticks x 9 cases)'
        type: boolean
        required: false
        default: false
      ticks:
        description: 'Number of complete ticks per measured case'
        type: choice
        required: true
        default: '10'
        options: ['10', '100', '720']
      intervals:
        description: 'Comma-separated autoplay intervals in milliseconds'
        type: string
        required: true
        default: '700,350,175,87.5'
      selection:
        description: 'Inspector case selection'
        type: choice
        required: true
        default: both
        options: [both, none, agent]

concurrency:
  group: browser-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.playback_benchmark && !inputs.engine_caller_attribution) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: food-meal-serving
            test: tests/browser-food-meal-serving-qa.mjs
            extra_test: tests/food-meal-serving.mjs
            artifact: artifacts/browser-food-meal-serving-qa
          - suite: social-response
            test: tests/browser-social-response-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-social-response-qa
          - suite: human-social-response
            test: tests/browser-human-social-response-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-human-social-response-qa
          - suite: memory-salience
            test: tests/browser-memory-salience-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-memory-salience-qa
          - suite: memory-deliberation
            test: tests/browser-memory-deliberation-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-memory-deliberation-qa
          - suite: social-outcome-memory
            test: tests/browser-social-outcome-memory-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-social-outcome-memory-qa
          - suite: presentation-event-truth
            test: tests/browser-presentation-event-truth-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-presentation-event-truth-qa
          - suite: observability-controls
            test: tests/browser-observability-controls-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-observability-controls-qa
          - suite: debug-replay-p1
            test: tests/browser-debug-replay-p1-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-debug-replay-p1-qa
          - suite: debug-inspector-contextual-diagnostics
            test: tests/browser-debug-inspector-contextual-diagnostics-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-debug-inspector-contextual-diagnostics-qa
          - suite: debug-inspector-desktop-nav-scroll
            test: tests/browser-debug-inspector-desktop-nav-scroll-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-debug-inspector-desktop-nav-scroll-qa
          - suite: resident-view
            test: tests/browser-resident-view-qa.mjs
            extra_test: tests/browser-runtime-hook-pipeline-qa.mjs
            artifact: artifacts/browser-resident-view-qa
          - suite: mental-regulation-presentation
            test: tests/browser-mental-regulation-presentation-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-mental-regulation-presentation-qa
          - suite: world-authoring-editor
            test: tests/browser-world-authoring-editor-qa.mjs
            extra_test: tests/browser-editor-ordinary-object-authoring-qa.mjs
            artifact: artifacts/browser-world-authoring-editor-qa
          - suite: editor-container-source-authoring
            test: tests/browser-editor-container-source-authoring-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-editor-container-source-authoring-qa
          - suite: standing-responsibility
            test: tests/browser-standing-responsibility-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-standing-responsibility-qa
          - suite: furniture-passage-yielding
            test: tests/browser-furniture-passage-yielding-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-furniture-passage-yielding-qa
          - suite: tidying-put-away
            test: tests/browser-tidying-put-away-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-tidying-put-away-qa
          - suite: step-batch-lifecycle
            test: tests/browser-step-batch-lifecycle-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-step-batch-lifecycle-qa
          - suite: step-batch-performance
            test: tests/browser-step-batch-performance-qa.mjs
            extra_test: ''
            artifact: artifacts/browser-step-batch-performance-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          echo $! > /tmp/emergent-causal-sim-http.pid
          sleep 2
      - run: node "${{ matrix.test }}"
      - if: matrix.extra_test != ''
        run: node "${{ matrix.extra_test }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}
          path: ${{ matrix.artifact }}
          if-no-files-found: ignore

  playback-benchmark:
    name: Opt-in full-render autoplay measurement (non-gating)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.playback_benchmark }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BENCHMARK_TICKS: ${{ github.event_name == 'workflow_dispatch' && inputs.ticks || '10' }}
      BENCHMARK_INTERVALS: ${{ github.event_name == 'workflow_dispatch' && inputs.intervals || '700,350,175,87.5' }}
      BENCHMARK_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Validate benchmark syntax
        run: node --check tests/browser-autoplay-speed-benchmark.mjs
      - name: Start simulator HTTP server
        run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          echo $! > /tmp/emergent-causal-sim-http.pid
          sleep 2
      - name: Measure complete tick and full render cadence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/browser-autoplay-speed-benchmark
          node tests/browser-autoplay-speed-benchmark.mjs \
            --ticks="$BENCHMARK_TICKS" \
            --intervals="$BENCHMARK_INTERVALS" \
            --selection="$BENCHMARK_SELECTION" 2>&1 \
            | tee artifacts/browser-autoplay-speed-benchmark/ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-playback-speed-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-autoplay-speed-benchmark/
          if-no-files-found: warn
          retention-days: 14

  engine-caller-attribution:
    name: Engine caller attribution diagnostic (non-gating)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_caller_attribution }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --check tests/browser-engine-cost-attribution.mjs
      - run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          sleep 2
      - run: |
          set -o pipefail
          mkdir -p artifacts/browser-engine-cost-attribution
          node tests/browser-engine-cost-attribution.mjs 2>&1 | tee artifacts/browser-engine-cost-attribution/ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-caller-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-engine-cost-attribution/
          if-no-files-found: warn
          retention-days: 14
