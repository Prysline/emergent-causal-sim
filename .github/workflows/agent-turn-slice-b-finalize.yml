name: Agent turn Slice B finalization gate

on:
  push:
    branches: [feat/agent-turn-execution]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-turn-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Slice B migration
        run: python scripts/agent-turn-slice-b-migrate.py
      - name: Preserve authority-specific version expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          new='11.50.0-agent-turn-execution'
          old='11.38.0-carried-handling-risk'
          for path in Path('tests').rglob('*.mjs'):
              text=path.read_text(); fixed=text
              fixed=fixed.replace(f"const ROUTE_VERSION='{new}';",f"const ROUTE_VERSION='{old}';")
              fixed=fixed.replace(f"const TRAVERSAL_VERSION='{new}';",f"const TRAVERSAL_VERSION='{old}';")
              for owner in ('SP.VERSION','globalThis.SimSpatial.VERSION','SP.ROUTE_SEMANTICS_VERSION','globalThis.SimSpatial.ROUTE_SEMANTICS_VERSION'):
                  fixed=fixed.replace(f"{owner},'{new}'",f"{owner},'{old}'")
              fixed=fixed.replace(r'11\.49\.0-agent-facing-foundation',r'11\.50\.0-agent-turn-execution')
              if fixed != text: path.write_text(fixed)
          PY
      - name: Static syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Focused regressions
        run: |
          node tests/agent-turn-execution.mjs
          node tests/agent-facing-foundation.mjs
          node tests/locomotion-execution-posture.mjs
          node tests/locomotion-traversal-cost.mjs
          node tests/initial-state-pipeline.mjs
      - name: Complete previously gated Node suffix
        run: |
          node tests/debug-inspector-contextual-diagnostics.mjs
          node tests/presentation-observability.mjs
          node tests/presentation-event-truth.mjs
      - name: Commit verified production diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f slice-b-verifier.log slice-b-full-node.log
          git checkout HEAD -- .github/workflows/node-regression.yml .github/workflows/agent-turn-slice-b-implementation.yml .github/workflows/agent-turn-slice-b-finalize.yml
          git add -A
          git status --short
          git commit -m "Implement Agent turn execution foundation"
          git push origin HEAD:feat/agent-turn-execution
