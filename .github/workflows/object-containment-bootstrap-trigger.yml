name: Object containment bootstrap trigger

on:
  push:
    branches: [feature/object-containment-v1]

permissions:
  contents: write

concurrency:
  group: object-containment-bootstrap-trigger
  cancel-in-progress: true

jobs:
  apply-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/object-containment-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard fresh base and bootstrap-only diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'a3892799fcf796d7a30f61444bbf9d21e0c55c80'
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'fresh-base ancestry guard failed' }
          $changed = @(git diff --name-only "$base..HEAD" | Sort-Object)
          $expected = @(
            '.github/workflows/object-containment-bootstrap-trigger.yml',
            '.github/workflows/object-containment-bootstrap.yml'
          ) | Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $changed
          if ($difference) {
            $changed | ForEach-Object { Write-Host "unexpected diff candidate: $_" }
            throw 'bootstrap-only diff guard failed'
          }
      - name: Extract and apply Object containment patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content '.github/workflows/object-containment-bootstrap.yml' -Raw
          $match = [regex]::Match($workflow, "payload = '([^']+)'")
          if (-not $match.Success) { throw 'embedded patch payload missing' }
          $compressed = [Convert]::FromBase64String($match.Groups[1].Value)
          $input = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          $gzip.CopyTo($output)
          $gzip.Dispose(); $input.Dispose()
          $patcher = Join-Path $env:RUNNER_TEMP 'apply_object_containment.py'
          [IO.File]::WriteAllBytes($patcher, $output.ToArray())
          $output.Dispose()
          $patchText = Get-Content $patcher -Raw
          $stale = '"    if(out){out.objectId=id;out.supportId=st.objects?.[id]?.supportId||null;}",'
          $fresh = '"if(out){out.objectId=id;out.supportId=st.objects?.[id]?.supportId||null;}",'
          if (-not $patchText.Contains($stale)) { throw 'expected stale spatial-observability anchor missing from patch payload' }
          [IO.File]::WriteAllText($patcher, $patchText.Replace($stale,$fresh), [Text.UTF8Encoding]::new($false))
          if (Get-Command python -ErrorAction SilentlyContinue) {
            & python $patcher
          } elseif (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 $patcher
          } else {
            throw 'Python 3 is required for the guarded patcher'
          }
          if ($LASTEXITCODE -ne 0) { throw "patcher failed with exit code $LASTEXITCODE" }
      - name: Focused validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'tests/check-source-syntax.mjs',
            'tests/object-containment.mjs',
            'tests/interaction-geometry.mjs',
            'tests/world-authoring-foundation.mjs',
            'tests/world-authoring-editor-contract.mjs',
            'tests/editor-authoring-mutations.mjs',
            'tests/editor-ordinary-object-authoring.mjs',
            'tests/production-source-load-architecture.mjs',
            'tests/presentation-observability.mjs'
          )
          foreach ($test in $tests) {
            & node $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
          $archiveChanges = @(git diff --name-only a3892799fcf796d7a30f61444bbf9d21e0c55c80 -- docs/archive)
          if ($archiveChanges.Count -gt 0) {
            $archiveChanges | ForEach-Object { Write-Host "historical archive change: $_" }
            throw 'Historical archive must not be rewritten.'
          }
      - name: Commit clean feature tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/object-containment-bootstrap.yml .github/workflows/object-containment-bootstrap-trigger.yml
          if ($LASTEXITCODE -ne 0) { throw 'failed to remove bootstrap workflows' }
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement object containment v1'
          if ($LASTEXITCODE -ne 0) { throw 'feature commit failed' }
          git push origin HEAD:feature/object-containment-v1
          if ($LASTEXITCODE -ne 0) { throw 'feature push failed' }
