name: Dev branch export

on:
  push:
    branches: [feature/sleep-carry-sleeping-integration]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: sleep-carry-branch-${{ github.sha }}
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
