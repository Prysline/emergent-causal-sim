name: Apply audited sleep carry patch

on:
  push:
    branches: [feature/sleep-carry-sleeping-integration]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: "${{ github.event.head_commit.message == 'Dev: apply staged audited sleep carry patch' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sleep-carry-sleeping-integration
          fetch-depth: 1
      - name: Verify and apply staged patch
        shell: bash
        run: |
          cat .github/patch-parts/sleep-carry-*.b64 > /tmp/patch.gz.b64
          test "$(wc -c < /tmp/patch.gz.b64)" -eq 20452
          printf '%s  %s\n' '5f631118429ed1b31de5cfdf6448b009199946483dac2046546e70f4b507ea8d' /tmp/patch.gz.b64 | sha256sum -c -
          base64 -d /tmp/patch.gz.b64 | gzip -d > /tmp/sleep-carry.patch
          patch --batch --forward -p1 < /tmp/sleep-carry.patch
      - name: Focused preflight
        run: |
          node --check src/spatial-candidate-selection.js
          node tests/workflow-architecture.mjs
          node tests/production-source-load-architecture.mjs
          node tests/test-profile-composition.mjs
          node tests/sleep-preferred-slot-conflict.mjs
          node tests/agent-carry-relocate.mjs
          node tests/contact-slot-corner-8-direction.mjs
      - name: Commit audited fixes and remove temporary transport
        shell: bash
        run: |
          rm .github/workflows/apply-sleep-carry-local-patch.yml
          rm -rf .github/patch-parts
          git config user.name "Boochu"
          git config user.email "mayhu1993@gmail.com"
          git add -A
          git commit -m "Sleep carry: sync integration regressions and contracts"
          git push origin HEAD:feature/sleep-carry-sleeping-integration
