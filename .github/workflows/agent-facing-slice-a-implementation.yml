name: Agent facing Slice A implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: agent-facing-slice-a-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/agent-facing-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-facing-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic Slice A migration
        run: python scripts/agent-facing-slice-a-migrate.py
      - name: Static syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Focused facing regression
        run: |
          node tests/agent-facing-foundation.mjs
          node tests/world-authoring-foundation.mjs
          node tests/initial-population-placement.mjs
      - name: Full Node regression profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shlex
          for line in Path('.github/workflows/node-regression.yml').read_text().splitlines():
              line=line.strip()
              if line.startswith('- run: node tests/'):
                  cmd=line[len('- run: '):]
                  print('+',cmd,flush=True)
                  subprocess.run(shlex.split(cmd),check=True)
          PY
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "Implement canonical agent facing foundation"
          git push origin HEAD:feat/agent-facing-foundation
