name: Engine caller attribution (opt-in)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/browser-engine-cost-attribution.mjs'
      - '.github/workflows/engine-caller-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    name: Engine caller attribution diagnostic (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --check tests/browser-engine-cost-attribution.mjs
      - run: |
          python3 -m http.server 4173 >/tmp/emergent-causal-sim-http.log 2>&1 &
          sleep 2
      - run: |
          set -o pipefail
          mkdir -p artifacts/browser-engine-cost-attribution
          node tests/browser-engine-cost-attribution.mjs 2>&1 | tee artifacts/browser-engine-cost-attribution/ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-caller-attribution
          path: artifacts/browser-engine-cost-attribution/
          if-no-files-found: warn
          retention-days: 14
