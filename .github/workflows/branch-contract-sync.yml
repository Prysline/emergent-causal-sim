name: Branch contract sync

on:
  push:
    branches: [feature/social-bid-carry-cooperation]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-bid-carry-cooperation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync contract docs and semantic marker assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          old='11.46.0-sleep-carry-integration'
          new='11.47.0-social-bid-carry-cooperation'
          # Preserve unchanged 11.46-owned subsystem assertions after overall bump.
          replacements={
            'assert.equal(AC.VERSION,APP_VERSION);':f"assert.equal(AC.VERSION,'{old}');",
            'assert.equal(W.AGENT_CARRY_SCHEMA_VERSION,APP_VERSION);':f"assert.equal(W.AGENT_CARRY_SCHEMA_VERSION,'{old}');",
            'assert.equal(E.AGENT_CARRY_SCHEMA_VERSION,APP_VERSION);':f"assert.equal(E.AGENT_CARRY_SCHEMA_VERSION,'{old}');",
            'assert.equal(SP.AGENT_CARRY_POSITION_PROJECTION_VERSION,APP_VERSION);':f"assert.equal(SP.AGENT_CARRY_POSITION_PROJECTION_VERSION,'{old}');",
            'assert.equal(SP.CANDIDATE_NODE_SELECTION_VERSION,APP_VERSION);':f"assert.equal(SP.CANDIDATE_NODE_SELECTION_VERSION,'{old}');",
          }
          for p in Path('tests').glob('*.mjs'):
              s=p.read_text(); s2=s
              for a,b in replacements.items(): s2=s2.replace(a,b)
              if p.name in {'browser-presentation-event-truth-qa.mjs','browser-resident-view-qa.mjs'}:
                  s2=s2.replace("'11.46.0-sleep-carry-integration'", "'11.47.0-social-bid-carry-cooperation'")
                  s2=s2.replace("'v11.46.0'", "'v11.47.0'")
                  s2=s2.replace('v11.46.0 browser readable entity QA','v11.47.0 browser readable entity QA')
              if s2!=s: p.write_text(s2)

          p=Path('README.md'); s=p.read_text(); s=s.replace('目前 runtime marker：**v11.46.0・Sleep preferred Slot conflict × sleeping Agent carry integration**（`11.46.0-sleep-carry-integration`）。','目前 runtime marker：**v11.47.0・Social Bid responder contract × awake cooperative carry**（`11.47.0-social-bid-carry-cooperation`）。',1); p.write_text(s)

          p=Path('docs/versioning.md'); s=p.read_text()
          s=s.replace('\n`11.46.0-sleep-carry-integration`\n\n玩家可見的 app 頁首 current-version display 使用短版 `v11.46.0`；', '\n`11.47.0-social-bid-carry-cooperation`\n\n玩家可見的 app 頁首 current-version display 使用短版 `v11.47.0`；',1)
          oldline='Current subsystem markers：Resources `11.39.0-carried-contents-loss`；Physical `11.45.0-agent-carry-relocate`；Agent Carry `11.46.0-sleep-carry-integration`；Spatial candidate selection `11.46.0-sleep-carry-integration`；Spatial Traversal / Route `11.38.0-carried-handling-risk`；Spatial Passage `11.39.1-surface-boundary-transition`；Deliberation / Decision Evidence / Sleep Slot Conflict `11.46.0-sleep-carry-integration`；Memory `11.42.0-usage-preference-sleep`；Usage Preference `11.42.0-usage-preference-sleep`；Affect `11.35.0-affect-responder-bias`；'
          newline='Current subsystem markers：Resources `11.39.0-carried-contents-loss`；Physical `11.45.0-agent-carry-relocate`；Agent Carry `11.46.0-sleep-carry-integration`；Social Bid `11.47.0-social-bid-carry-cooperation`；Spatial candidate selection `11.46.0-sleep-carry-integration`；Spatial Traversal / Route `11.38.0-carried-handling-risk`；Spatial Passage `11.39.1-surface-boundary-transition`；Deliberation / Decision Evidence / Sleep Slot Conflict `11.47.0-social-bid-carry-cooperation`；Memory `11.42.0-usage-preference-sleep`；Usage Preference `11.42.0-usage-preference-sleep`；Affect `11.35.0-affect-responder-bias`；'
          s=s.replace(oldline,newline,1)
          anchor='### Current Sleep conflict × sleeping Agent carry integration release'
          section='''### Current Social Bid responder contract × awake cooperative carry release\n\n`11.47.0-social-bid-carry-cooperation` 將 Social Bid responder contract 從 `petAnimal` 專用路徑泛化為可註冊的 `bidKind` contract。Social Bid 現在單一持有 directed Bid observation、requester wait / expiry、responder identity validation、response Action / Event contract，以及 responder-owned canonical `accepted` / `refused` / `delayed` response representation；所有 response 以 `responseToBid` 連回原始 World Event，validator 對缺失 contract、錯誤 requester / responder、錯誤 response action 與共享 `accepted / cooperative` lifecycle flag 明確失敗。\n\nSleep conflict 只作為 domain consumer：awake Human / Animal occupant 必須先收到 target-specific `carryCooperation` Bid，responder 自己產生 accept / refuse / delay，requester 實際觀察 response 後重新 Deliberation。只有 requester、responder、original Bid、`sleepSlotConflict`、original Slot 與 proposed `targetPlacement` 全部一致且仍在 Social Bid evidence lifetime 內的 accepted provenance，才可派生 cooperative `carryOccupant` candidate。accept 本身不建立 carry relation；execution 仍由既有 Agent Carry `carryAgent` lifecycle 與 execution-time World-truth feasibility 擁有。Sleeping occupant path 維持既有 `11.46.0` 行為，不改成 Social Bid dependency。\n\nVersion impact：overall / Presentation、Social Bid、Deliberation / Decision Evidence / Sleep Slot Conflict → `11.47.0-social-bid-carry-cooperation`。Agent Carry 與 Spatial candidate selection 維持 `11.46.0-sleep-carry-integration`；Physical 維持 `11.45.0-agent-carry-relocate`；Spatial Traversal / Route / Locomotion 維持 `11.38.0-carried-handling-risk`；Memory / Usage Preference 維持 `11.42.0-usage-preference-sleep`；World Authoring 維持 `world-authoring-v11`；Furniture Catalog 維持 `furniture-definitions-v12`；Embodiment Capabilities 維持 `embodiment-capabilities-v5`。\n\n'''
          if section not in s: s=s.replace(anchor,section+anchor,1)
          p.write_text(s)

          for name in ['docs/architecture.md','docs/tick-pipeline.md']:
              p=Path(name); s=p.read_text();
              if '11.47.0-social-bid-carry-cooperation' not in s[:3000]:
                  marker='\n## '
                  note='\n> Current `11.47.0-social-bid-carry-cooperation`：Social Bid responder contract 以 `bidKind` registry 單一持有 responder validation / response provenance；Sleep `carryCooperation` 是 domain consumer。awake accepted response 只形成可失效、target-specific evidence，實際 carry 仍交給 Agent Carry。Runtime ordering 維持 named hook registry；Social Bid event-created observation 不依賴 script wrapper fallback。\n\n'
                  idx=s.find(marker)
                  if idx>=0: s=s[:idx]+note+s[idx:]
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Social Bid cooperation contracts and markers"
          git push origin HEAD:feature/social-bid-carry-cooperation
